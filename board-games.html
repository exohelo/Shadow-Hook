<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b0a14">
<title>Board Games · The Shadow Hook</title>
<script src="/game_shell.js?v=nov24a"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<!-- #boardgames(nov21) — turn-based games members play against each other: make a move, walk away, come back on your turn.
     Connect 4 · Sink the Ship · Dock Words · Checkers. Every move is checked on the server (bg_move); this page only draws. -->
<style>
:root{--bg:#0b0a14;--card:#161327;--card2:#1e1a35;--line:#ffffff1f;--tx:#f4f1ff;--mut:#a9a2cf;--gold:#fbbf24;--vio:#8b5cf6;--red:#ef4444;--grn:#22c55e;--blu:#38bdf8}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:"Barlow Condensed",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 28px)}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:520px;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.top a{color:var(--mut);text-decoration:none;font-weight:700;font-size:15px}
h1{font:400 34px/1 Anton,sans-serif;letter-spacing:1px;margin:6px 0 2px;color:var(--gold);text-align:center}
.sub{text-align:center;color:var(--mut);font-size:15px;margin-bottom:12px}
.tabs{display:flex;gap:6px;margin:8px 0 14px}
.tabs button{flex:1;padding:10px 4px;border-radius:12px;border:2px solid var(--line);background:var(--card);font:400 15px/1 Anton,sans-serif;letter-spacing:1px}
.tabs button.on{border-color:var(--vio);background:#2b2052}
.sec{margin:14px 0 6px;font:400 17px/1 Anton,sans-serif;letter-spacing:1px;color:var(--gold)}
.empty{color:var(--mut);font-size:15px;padding:6px 2px 10px}
.row{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);margin-bottom:8px}
.row.hot{border-color:#fbbf24aa;background:#241c0b}
.ico{font-size:24px;width:32px;text-align:center;flex:none}
.rt{flex:1;min-width:0}
.rt b{display:block;font-size:17px}
.rt span{display:block;font-size:14px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{padding:9px 14px;border-radius:11px;border:0;background:var(--vio);color:#fff;font:400 15px/1 Anton,sans-serif;letter-spacing:1px;white-space:nowrap}
.btn.gold{background:var(--gold);color:#2a1d02}.btn.ghost{background:transparent;border:2px solid var(--line)}.btn.red{background:#7f1d1d}
.btn:disabled{opacity:.45}
.picks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pick{padding:14px 10px;border-radius:14px;border:2px solid var(--line);background:var(--card);text-align:left}
.pick.on{border-color:var(--gold);background:#2a210b}
.pick .pi{font-size:28px}.pick b{display:block;font:400 18px/1.1 Anton,sans-serif;letter-spacing:.5px;margin-top:4px}.pick span{display:block;color:var(--mut);font-size:13.5px;margin-top:3px;line-height:1.3}
.field{display:flex;gap:8px;margin:12px 0}
.field input{flex:1;min-width:0;padding:12px;border-radius:12px;border:2px solid var(--line);background:#0f0d1c;color:var(--tx);font:600 17px "Barlow Condensed",sans-serif;text-transform:uppercase}
.note{color:var(--mut);font-size:14px;line-height:1.45}
table.lb{width:100%;border-collapse:collapse;font-size:16px}
table.lb td{padding:8px 6px;border-bottom:1px solid var(--line)}
table.lb td:first-child{color:var(--mut);width:34px}
table.lb tr.me td{color:var(--gold)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chips button{padding:7px 11px;border-radius:999px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:14px}
.chips button.on{border-color:var(--gold);color:var(--gold)}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 18px);transform:translateX(-50%);background:#000d;border:1px solid var(--line);padding:10px 14px;border-radius:12px;font-weight:700;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center;z-index:50}
/* #lobbyfun(nov25): the lobby, dressed up */
.hero{position:relative;margin:2px -14px 10px;height:190px;background:#1b1438 center 60%/cover no-repeat var(--hero);overflow:hidden;border-bottom:2px solid #fbbf2455}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0b0a1400 0,#0b0a1422 40%,#0b0a14ee 100%)}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 0,#fbbf2433,transparent 50%);mix-blend-mode:screen}
.hero-in{position:absolute;left:0;right:0;bottom:12px;text-align:center;z-index:1}
.hero-k{display:inline-block;padding:4px 10px;border-radius:999px;background:#0b0a14b0;border:1px solid #fbbf2466;color:#fde68a;font:700 12px/1 "Barlow Condensed",sans-serif;letter-spacing:2px;backdrop-filter:blur(4px)}
.hero h1{font-size:46px;margin:6px 0 0;background:linear-gradient(180deg,#fff7d6 0,#fbbf24 55%,#f59e0b 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #7c2d12) drop-shadow(0 0 18px #fbbf2466)}
.hero .sub{color:#e9e3ff;text-shadow:0 1px 3px #000;margin:2px 0 0}
.tabs button{position:relative;transition:transform .12s}
.tabs button:active{transform:scale(.96)}
.tabs button.on{border-color:transparent;background:linear-gradient(135deg,#8b5cf6,#ec4899);box-shadow:0 4px 14px #8b5cf655}
.sec{display:flex;align-items:center;gap:8px;font-size:19px}
.sec em{font-style:normal;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--gold);color:#2a1d02;font:400 14px/22px Anton,sans-serif;text-align:center}
.empty.big{font-size:17px;color:#d6d0f5}
.row{--gc:#8b5cf6;position:relative;overflow:hidden;background:linear-gradient(100deg,color-mix(in srgb,var(--gc) 22%,#161327) 0,#161327 55%);border:1px solid color-mix(in srgb,var(--gc) 40%,transparent);padding:10px 12px 10px 10px;transition:transform .12s}
.row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--gc)}
.row:active{transform:scale(.985)}
.row .ico{width:50px;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 40% 35%,color-mix(in srgb,var(--gc) 55%,#fff0),color-mix(in srgb,var(--gc) 18%,#0b0a14) 75%);box-shadow:inset 0 0 0 1px #ffffff1a}
.row .ico .gic{width:42px;height:42px}
.row.hot{border-color:#fbbf24;background:linear-gradient(100deg,#4a3410 0,#241c0b 60%);animation:hotGlow 1.8s ease-in-out infinite}
@keyframes hotGlow{0%,100%{box-shadow:0 0 0 0 #fbbf2400}50%{box-shadow:0 0 16px 2px #fbbf2455}}
.row.hot .ico .gic{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-3px) rotate(3deg)}}
.row.done{opacity:.85}
.chip{display:inline-block;font:400 11px/1 Anton,sans-serif;letter-spacing:1px;padding:3px 7px 2px;border-radius:6px;margin-bottom:3px;background:#ffffff22;color:#fff;font-style:normal}
.chip.go{background:var(--gold);color:#2a1d02}.chip.new{background:#ec4899}.chip.win{background:#16a34a}.chip.lose{background:#7f1d1d;color:#fecaca}
.rt b{font-size:18px}
.btn{transition:transform .1s,filter .1s}.btn:active{transform:scale(.95)}
.btn.gold{background:linear-gradient(180deg,#fde68a,#fbbf24 45%,#f59e0b);box-shadow:0 3px 0 #b45309,0 6px 14px #f59e0b44}
.btn.big{padding:16px;font-size:20px;border-radius:14px}
.btn.shine{position:relative;overflow:hidden}
.btn.shine::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,#ffffff88,transparent);animation:shine 3.2s ease-in-out infinite}
@keyframes shine{0%,60%{left:-60%}100%{left:130%}}
.pick{--gc:#8b5cf6;position:relative;overflow:hidden;border:2px solid color-mix(in srgb,var(--gc) 45%,transparent);background:linear-gradient(160deg,color-mix(in srgb,var(--gc) 35%,#161327) 0,#161327 70%);transition:transform .12s}
.pick:active{transform:scale(.97)}
.pick .pi{height:64px;display:flex;align-items:center}
.pick .pi .gic{width:64px;height:64px;margin:0;filter:drop-shadow(0 4px 6px #0008)}
.pick.on{border-color:var(--gold);background:linear-gradient(160deg,color-mix(in srgb,var(--gc) 55%,#2a210b) 0,#2a210b 75%);box-shadow:0 0 0 2px #fbbf2455,0 8px 20px #fbbf2433}
.pick.on .pi .gic{animation:bob 1.4s ease-in-out infinite}
.pick.on::after{content:"✓";position:absolute;top:8px;right:10px;width:24px;height:24px;border-radius:50%;background:var(--gold);color:#2a1d02;font:400 15px/24px Anton,sans-serif;text-align:center}
table.lb tr:nth-child(-n+3) td{font-size:18px}
/* game view */
#game{display:none}
.ghead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 8px}
.pl{flex:1;padding:8px 10px;border-radius:12px;background:var(--card);border:2px solid var(--line);text-align:center;min-width:0}
.pl b{display:block;font:400 17px/1.1 Anton,sans-serif;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pl span{font-size:13px;color:var(--mut)}
.pl.on{border-color:var(--gold);box-shadow:0 0 14px #fbbf2444}
.vs{font:400 16px Anton,sans-serif;color:var(--mut)}
.status{text-align:center;font:400 21px/1.2 Anton,sans-serif;letter-spacing:.5px;margin:8px 0 12px;min-height:26px}
.status small{display:block;font:600 14px "Barlow Condensed",sans-serif;color:var(--mut);letter-spacing:0;margin-top:3px}
.gfoot{display:flex;gap:8px;justify-content:center;margin-top:14px}
/* connect 4 */
.c4{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;padding:8px;border-radius:16px;background:#1d3a8a;max-width:420px;margin:0 auto}
.c4 .cell{aspect-ratio:1;border-radius:50%;background:#0b0a14;box-shadow:inset 0 3px 6px #0008}
.c4 .cell.p1{background:radial-gradient(circle at 35% 35%,#ffe27a,#f2a900)}.c4 .cell.p2{background:radial-gradient(circle at 35% 35%,#ff8a80,#d32f2f)}
.c4 .cell.last{outline:3px solid #fff;outline-offset:-3px}
.c4cols{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;max-width:420px;margin:0 auto 6px;padding:0 8px}
.c4cols button{border:0;background:#ffffff14;border-radius:8px;padding:8px 0;font:400 16px Anton,sans-serif}
.c4cols button:disabled{opacity:.25}
/* checkers */
.ck{display:grid;grid-template-columns:repeat(8,1fr);max-width:440px;margin:0 auto;border:6px solid #5b3a1e;border-radius:10px;overflow:hidden}
.ck .sq{aspect-ratio:1;display:flex;align-items:center;justify-content:center;position:relative}
.ck .sq.l{background:#e8d3a6}.ck .sq.d{background:#7a4b26}
.ck .sq.tgt::after{content:"";width:34%;height:34%;border-radius:50%;background:#22c55ecc}
.ck .sq.last{box-shadow:inset 0 0 0 3px #fbbf2499}
.pc{width:78%;height:78%;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 3px 0 #0007, inset 0 -3px 0 #0003}
.pc.s1{background:radial-gradient(circle at 35% 35%,#fff3c4,#e0b84a)}.pc.s2{background:radial-gradient(circle at 35% 35%,#ff8a80,#b71c1c)}
.pc.sel{outline:3px solid #22c55e;outline-offset:2px}
/* chess */
.chb{display:grid;grid-template-columns:repeat(8,1fr);max-width:440px;margin:0 auto;border:6px solid #5b3a1e;border-radius:10px;overflow:hidden;position:relative;background-size:cover}
.chb .sq{aspect-ratio:1;display:flex;align-items:center;justify-content:center;position:relative;user-select:none;-webkit-user-select:none}
.chb .sq.l{background:#e8d3a6}.chb .sq.d{background:#a06a3c}
.chb .sq.last{box-shadow:inset 0 0 0 100px #fbbf2440}
.chb .sq.sel{box-shadow:inset 0 0 0 100px #22c55e55}
.chb .sq.chk{background:radial-gradient(circle,#ef4444 0,#ef444488 45%,transparent 75%)}
.chb .sq.tgt::after{content:"";position:absolute;width:30%;height:30%;border-radius:50%;background:#14532dcc;pointer-events:none}
.chb .sq.tgt.cap::after{width:86%;height:86%;background:none;border:4px solid #14532dcc;box-sizing:border-box}
.chb .co{position:absolute;font:700 9px/1 "Barlow Condensed",sans-serif;opacity:.65;pointer-events:none}
.chb .co.f{right:3px;bottom:2px}.chb .co.r{left:3px;top:2px}
.chb .sq.l .co{color:#7a4b26}.chb .sq.d .co{color:#f3e2bf}
.cp{font-size:clamp(26px,8.6vw,44px);line-height:1;pointer-events:none;font-family:"Segoe UI Symbol","Noto Sans Symbols 2","DejaVu Sans",serif;width:92%;height:92%;display:flex;align-items:center;justify-content:center}
.cp.w{color:#fff8e6;text-shadow:0 0 1px #2a1a0c,0 0 1px #2a1a0c,1px 1px 0 #2a1a0c,-1px -1px 0 #2a1a0c,1px -1px 0 #2a1a0c,-1px 1px 0 #2a1a0c,0 2px 3px #0008}
.cp.b{color:#1a120c;text-shadow:0 0 1px #f3e2bf,0 1px 2px #0006}
.cp img{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 2px 2px #0007)}
.chpro{display:flex;gap:8px;justify-content:center;margin:10px 0 0}
.chpro button{width:58px;height:58px;border-radius:12px;border:2px solid var(--gold);background:var(--card);display:flex;align-items:center;justify-content:center}
.capt{font-size:15px;letter-spacing:-2px;min-height:18px}
/* dominoes */
.dinfo{display:flex;justify-content:space-between;color:var(--mut);font-size:14px;margin:0 2px 8px}.dinfo b{color:var(--ink,#fff)}
.dtable{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-items:center;min-height:86px;padding:12px 8px;border-radius:14px;background:radial-gradient(ellipse at 50% 40%,#1f6b45,#0f3d27);box-shadow:inset 0 0 0 4px #5b3a1e,inset 0 6px 18px #0008}
.dempty{color:#ffffffaa;font-weight:700}
.dends{display:flex;justify-content:space-between;color:var(--mut);font-size:13px;margin:6px 4px 0}.dends b{color:var(--gold)}
.dt{--u:15px;display:inline-flex;align-items:center;gap:0;padding:2px;border-radius:7px;background:linear-gradient(#fffaf0,#efe4cc);box-shadow:0 2px 0 #00000055,inset 0 0 0 1px #00000033;background-size:100% 100%}
.dt .dh{display:grid;grid-template-columns:repeat(3,var(--u));grid-template-rows:repeat(3,var(--u));padding:2px}
.dt .dh i{display:flex;align-items:center;justify-content:center}.dt .dh i.on::after{content:"";width:62%;height:62%;border-radius:50%;background:#1a120c;box-shadow:inset 0 1px 1px #fff4}
.dt .dd{width:2px;align-self:stretch;margin:3px 1px;background:#b08a3e;border-radius:2px}
.dt.v{flex-direction:column}.dt.v .dd{width:auto;height:2px;margin:1px 3px;align-self:stretch}
.dtable .dt{--u:8px}
.dt.new{box-shadow:0 0 0 3px var(--gold),0 2px 0 #00000055}
.dt.endL,.dt.endR{box-shadow:0 0 0 3px #22c55e,0 2px 0 #00000055}
.dhand{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.dhand .dt{--u:11px;cursor:pointer;transition:transform .12s}
.dhand .dt.ok{box-shadow:0 0 0 2px #22c55e,0 2px 0 #00000055}.dhand .dt.dim{opacity:.45}
.dhand .dt.sel{transform:translateY(-6px);box-shadow:0 0 0 3px var(--gold),0 6px 10px #0007}
.dpick{display:flex;gap:8px;justify-content:center;margin-top:12px}
/* #bgart(nov25): Midjourney art — each rule only applies once its picture is cut out (html.a-<name>) */
.gic{width:34px;height:34px;object-fit:contain;display:block;margin:0 auto;filter:drop-shadow(0 2px 2px #0006)}
.pick .gic{width:54px;height:54px}.gic.sm{width:22px;height:22px;display:inline-block;vertical-align:-5px;margin:0}
.ico .gic{width:34px;height:34px}
html.a-c4_1 .c4 .cell.p1{background:center/94% no-repeat var(--a-c4_1)}
html.a-c4_2 .c4 .cell.p2{background:center/94% no-repeat var(--a-c4_2)}
html.a-ck_1 .pc.s1{background:center/100% no-repeat var(--a-ck_1);box-shadow:0 2px 2px #0006}
html.a-ck_2 .pc.s2{background:center/100% no-repeat var(--a-ck_2);box-shadow:0 2px 2px #0006}
html.a-ck_3 .pc.s1.k{background-image:var(--a-ck_3);font-size:0}
html.a-ck_4 .pc.s2.k{background-image:var(--a-ck_4);font-size:0}
html.a-hit .grid .g.hit{background:#14507d center/90% no-repeat var(--a-hit);color:transparent}
html.a-hit .grid .g.sunk{background:#4c1010 center/90% no-repeat var(--a-hit);color:transparent}
html.a-miss .grid .g.miss::after{width:88%;height:88%;border-radius:0;background:center/contain no-repeat var(--a-miss)}
html.a-dtile .dt{background:center/100% 100% no-repeat var(--a-dtile);box-shadow:0 2px 3px #0007}
/* #funpass(nov25): Midjourney surfaces */
.ck,.chb{border:0!important;padding:10px;background:#5b3a1e url('https://cdn.midjourney.com/6753faf6-9e21-462a-b246-7d8d1b35694f/0_1_640_N.webp') center/240px repeat;box-shadow:0 8px 20px #000a,inset 0 0 0 2px #00000066,inset 0 0 18px #0008}
.ck .sq,.chb .sq{box-shadow:inset 0 0 0 .5px #0002}
.dtable{background:#0f3d27 url('https://cdn.midjourney.com/ab0b1543-9af6-45b3-9a7c-0d369c13de12/0_0_640_N.webp') center/280px repeat!important;border:10px solid #5b3a1e;border-image:url('https://cdn.midjourney.com/6753faf6-9e21-462a-b246-7d8d1b35694f/0_1_640_N.webp') 60 round;border-radius:6px;box-shadow:inset 0 6px 18px #000a!important}
html .grid{background:#0c3a5c url('https://cdn.midjourney.com/53af1b82-8234-4dca-b2c8-c0571ab6ebe7/0_1_640_N.webp') center/220px repeat;padding:5px;box-shadow:0 6px 16px #0009}
html .grid .g{background:#082a4599;border-radius:3px;box-shadow:inset 0 0 0 1px #ffffff1c}
html .grid .g.ship{background:#9aa5b1ee}html .grid .g.ship.pv{background:#6ee7b7ee}html .grid .g.bad{background:#ef4444aa}html .grid .g.sunk{background:#7f1d1dcc}
html.a-hit .grid .g.hit{background:#082a4599 center/90% no-repeat var(--a-hit)}
/* Dock Words: the crane lowers the crate one step per miss */
.hscene{position:relative;width:100%;max-width:360px;aspect-ratio:4/3;margin:0 auto 6px;border-radius:14px;overflow:hidden;background:#3b2a5a url('https://cdn.midjourney.com/9583ae57-3419-49bd-b9f9-3237f6469c3e/0_3_640_N.webp') center/cover no-repeat;box-shadow:0 6px 18px #0009,inset 0 0 0 2px #ffffff14}
.hchain{position:absolute;width:5px;margin-left:-2.5px;top:18%;background:repeating-linear-gradient(180deg,#9ca3af 0 5px,#4b5563 5px 7px);border-radius:2px;transition:height .7s cubic-bezier(.3,1.4,.5,1)}
.hcrate{position:absolute;height:30%;transform:translateX(-50%);filter:drop-shadow(0 4px 4px #0008);transition:top .7s cubic-bezier(.3,1.4,.5,1);transform-origin:50% 0;animation:sway 3.2s ease-in-out infinite}
@keyframes sway{0%,100%{rotate:-2deg}50%{rotate:2deg}}
.hscene.lost .hcrate{animation:none;rotate:8deg;opacity:.9}
.hsplash{position:absolute;width:34%;transform:translateX(-50%);top:54%;animation:pop .5s ease-out}
.hscene.won .hcrate{filter:drop-shadow(0 0 10px #fde047) drop-shadow(0 4px 4px #0008)}
.hbadge{position:absolute;left:50%;transform:translateX(-50%);bottom:8%;padding:5px 12px;border-radius:999px;font:400 16px/1 Anton,sans-serif;letter-spacing:1px;background:#16a34a;color:#fff;box-shadow:0 3px 10px #0008;animation:pop .5s ease-out}
.hscene.lost .hbadge{background:#b91c1c}
.hmeter{position:absolute;right:8px;top:8px;padding:3px 8px;border-radius:8px;background:#0b0a14b3;color:#fde68a;font:400 13px/1.2 Anton,sans-serif;letter-spacing:1px}
@keyframes pop{0%{transform:translateX(-50%) scale(.3);opacity:0}70%{transform:translateX(-50%) scale(1.12);opacity:1}100%{transform:translateX(-50%) scale(1)}}
/* the end of a game */
#endFx{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#1e1a35ee,#05040aee);animation:fxIn .3s ease-out;overflow:hidden}
#endFx .ef-card{position:relative;z-index:2;text-align:center;padding:10px 24px 22px;max-width:340px}
#endFx .ef-art{width:200px;height:200px;object-fit:contain;display:block;margin:0 auto;animation:artIn .8s cubic-bezier(.2,1.6,.4,1) both,artBob 2.6s ease-in-out .8s infinite;filter:drop-shadow(0 10px 18px #000a)}
#endFx .ef-emo{font-size:120px;line-height:200px;animation:artIn .8s cubic-bezier(.2,1.6,.4,1) both}
#endFx .ef-t{font:400 48px/1 Anton,sans-serif;letter-spacing:1px;margin-top:6px;background:linear-gradient(180deg,#fff7d6,#fbbf24 60%,#f59e0b);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #7c2d12) drop-shadow(0 0 20px #fbbf2455);animation:artIn .7s cubic-bezier(.2,1.6,.4,1) .15s both}
#endFx.lose .ef-t{background:linear-gradient(180deg,#e0f2fe,#93c5fd 60%,#60a5fa);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 3px 0 #1e3a8a)}
#endFx.draw .ef-t{background:linear-gradient(180deg,#fff,#fdba74 60%,#f97316);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 3px 0 #7c2d12)}
#endFx .ef-s{color:#d6d0f5;font-size:17px;margin:8px 0 18px;animation:fxIn .6s ease-out .3s both}
#endFx .ef-b{display:flex;gap:10px;justify-content:center;animation:fxIn .6s ease-out .45s both}
#endFx .cf{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;z-index:1;animation:cfall linear forwards}
@keyframes cfall{to{transform:translate3d(var(--dx),110vh,0) rotate(var(--r))}}
@keyframes fxIn{from{opacity:0}to{opacity:1}}
@keyframes artIn{0%{transform:scale(.2) rotate(-12deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes artBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
/* sink the ship */
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;max-width:400px;margin:0 auto;padding:4px;border-radius:10px;background:#0c3a5c}
.grid .g{aspect-ratio:1;background:#14507d;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.grid .g.ship{background:#9aa5b1}.grid .g.ship.pv{background:#6ee7b7}.grid .g.bad{background:#ef4444aa}
.grid .g.hit{background:#dc2626;color:#fff}.grid .g.miss::after{content:"";width:28%;height:28%;border-radius:50%;background:#cbd5e1}
.grid .g.sunk{background:#7f1d1d;color:#fca5a5}
.grid .g.last{outline:2px solid var(--gold)}
.gl{text-align:center;font:400 15px Anton,sans-serif;letter-spacing:1px;color:var(--mut);margin:12px 0 6px}
.fleetbar{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0}
.fleetbar button{padding:7px 10px;border-radius:10px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:14px}
.fleetbar button.on{border-color:var(--gold)}.fleetbar button.done{opacity:.5}
/* dock words */
.hangsvg{display:block;margin:0 auto;width:200px;height:170px}
.mask{text-align:center;font:400 30px/1.2 Anton,sans-serif;letter-spacing:7px;margin:10px 0 4px;word-break:break-all}
.hint{text-align:center;color:var(--mut);font-size:15px;margin-bottom:10px}
.kb{display:grid;grid-template-columns:repeat(9,1fr);gap:5px;max-width:440px;margin:0 auto}
.kb button{padding:11px 0;border-radius:8px;border:0;background:#ffffff1a;font:400 18px Anton,sans-serif}
.kb button.hit{background:#166534}.kb button.miss{background:#3f1d1d;color:#a8a29e}
.opp{text-align:center;color:var(--mut);font-size:15px;margin-top:12px}
</style>

      <div class="hero-in"><div class="hero-k">🎲 GAME NIGHT ON THE DOCK</div><h1>BOARD GAMES</h1><div class="sub">Make your move, walk away, come back on your turn.</div></div>

</div>

<script>
var SB_URL='https://ehykqebzkbelwtkgjbml.supabase.co', SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVoeWtxZWJ6a2JlbHd0a2dqYm1sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzMDMwNTMsImV4cCI6MjA5OTg3OTA1M30.RgdTFy1HNE36lN3bM6ovjkmAJsTEps0GmgRuI6h6IpI';

var GAMES={c4:{c:'#3b82f6',n:'Connect 4',i:'🔴',d:'Drop discs. Four in a row wins.'},ship:{c:'#ef4444',n:'Sink the Ship',i:'🚢',d:'Hide your fleet. Call your shots.'},hang:{c:'#14b8a6',n:'Dock Words',i:'🪝',d:'Same dock word for both. Fewer misses wins.'},checkers:{c:'#f97316',n:'Checkers',i:'⛀',d:'Classic. Jump if you want to — it\'s your call.'},chess:{c:'#a78bfa',n:'Chess',i:'♞',d:'The king of board games. Checkmate wins.'},dom:{c:'#22c55e',n:'Dominoes',i:'🎲',d:'Match the ends. First one out of tiles wins.'}};
function $(id){ return document.getElementById(id); }
function esc(t){ return String(t==null?'':t).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
var toastT=0; function toast(t){ var el=$('toast'); el.textContent=t; el.style.opacity=1; clearTimeout(toastT); toastT=setTimeout(function(){ el.style.opacity=0; },2800); }
function rpc(fn,args){ if(!sb) return Promise.reject(new Error('offline')); return sb.rpc(fn,args||{}).then(function(r){ if(r.error) throw new Error(r.error.message||'something went wrong'); return r.data; }); }
function oppName(g){ return g.seat===1?(g.p2||'anyone'):g.p1; }
function left(g){ var ms=new Date(g.deadline).getTime()-Date.now(); if(ms<=0) return 'time\'s up'; var h=Math.floor(ms/3600000), m=Math.floor(ms%3600000/60000); return h?h+'h '+m+'m left':m+'m left'; }
function ago(t){ var s=(Date.now()-new Date(t).getTime())/1000; if(s<60) return 'just now'; if(s<3600) return Math.floor(s/60)+'m ago'; if(s<86400) return Math.floor(s/3600)+'h ago'; return Math.floor(s/86400)+'d ago'; }

/* ───────────── boot ───────────── */
(function(){
  var s=document.createElement('script'); s.src='/supabase-js-2.112.2.js';
  s.onload=function(){

function signedOut(){ $('tab-games').innerHTML='<div class="row"><div class="rt"><b>Sign in first</b><span>Open <a href="/" style="color:var(--gold)">The Shadow Hook</a>, sign in, then come back.</span></div></div>'; }

  ['games','new','board'].forEach(function(k){ $('tab-'+k).style.display=k===t?'':'none'; });
  if(t==='new') renderNew(); if(t==='board') loadBoard(); if(t==='games') renderGames(); }
function startPoll(){ clearInterval(pollT); pollT=setInterval(function(){ if(document.hidden) return; if(G){ if(!G.my_turn&&G.status!=='done') refreshGame(); } else if(TAB==='games') loadLobby(); }, G?4000:9000); }

/* ───────────── lobby ───────────── */
function loadLobby(){ return rpc('bg_lobby').then(function(x){ L=x; ME=x.me; $('who').textContent=ME; if(TAB==='games') renderGames(); startPoll(); }).catch(function(e){ $('tab-games').innerHTML='<div class="empty">'+esc(e.message)+'</div>'; }); }
function gameRow(g,act){
  var gm=GAMES[g.game], line;
  if(g.status==='open'){ line=g.invite_for_me?(g.p1+' challenged you'):(g.p2?'waiting on '+g.p2+' to accept':'open to anyone'); }
  else if(g.status==='live'){ line=(g.my_turn?'your move':'waiting on '+oppName(g))+' · '+left(g); }
  else if(g.status==='done'){ line=(g.winner===0?'draw':g.winner===g.seat?'you won':'you lost')+(g.reason?' · '+g.reason:'')+' · '+ago(g.updated_at); }
  else line=g.status;
  var hot=g.my_turn||g.invite_for_me, chip=g.invite_for_me?'<i class="chip new">NEW</i>':g.my_turn?'<i class="chip go">YOUR MOVE</i>':g.status==='done'?(g.winner===0?'<i class="chip">DRAW</i>':g.winner===g.seat?'<i class="chip win">WON 🏆</i>':'<i class="chip lose">LOST</i>'):'';
  return '<div class="row'+(hot?' hot':'')+(g.status==='done'?' done':'')+'" style="--gc:'+(gm.c||'#8b5cf6')+'"><div class="ico">'+gIcon(g.game)+'</div><div class="rt">'+chip+'<b>'+esc(gm.n)+' vs '+esc(g.status==='open'&&g.invite_for_me?g.p1:oppName(g))+'</b><span>'+esc(line)+'</span></div>'+act+'</div>';
}
function renderGames(){
  if(!L) return;
  var mine=L.games||[], h='';
  var yours=mine.filter(function(g){ return g.my_turn||g.invite_for_me; });
  var wait=mine.filter(function(g){ return (g.status==='live'&&!g.my_turn)||g.mine_open; });
  var done=mine.filter(function(g){ return g.status==='done'; }).slice(0,10);
  h+='<div class="sec">🔥 YOUR MOVE'+(yours.length?'<em>'+yours.length+'</em>':'')+'</div>';
  h+=yours.length?yours.map(function(g){ return gameRow(g, g.invite_for_me?'<button class="btn gold" data-acc="'+g.id+'">PLAY</button><button class="btn ghost" data-dec="'+g.id+'">✕</button>':'<button class="btn gold" data-open="'+g.id+'">GO</button>'); }).join(''):'<div class="empty big">😎 You\'re all caught up. Start something below.</div>';
  h+='<div class="sec">⏳ WAITING ON THEM'+(wait.length?'<em>'+wait.length+'</em>':'')+'</div>';
  h+=wait.length?wait.map(function(g){ return gameRow(g, g.mine_open?'<button class="btn ghost" data-dec="'+g.id+'">CANCEL</button>':'<button class="btn ghost" data-open="'+g.id+'">VIEW</button>'); }).join(''):'<div class="empty">Nobody owes you a move.</div>';
  var open=(L.open||[]);
  h+='<div class="sec">📣 OPEN CHALLENGES'+(open.length?'<em>'+open.length+'</em>':'')+'</div>';
  h+=open.length?open.map(function(g){ return gameRow(g,'<button class="btn" data-acc="'+g.id+'">JOIN</button>'); }).join(''):'<div class="empty">No open challenges right now — post one and see who bites.</div>';
  if(done.length){ h+='<div class="sec">🏁 FINISHED</div>'+done.map(function(g){ return gameRow(g,'<button class="btn ghost" data-open="'+g.id+'">SEE</button>'); }).join(''); }
  h+='<div style="margin-top:16px"><button class="btn gold big shine" style="width:100%" onclick="setTab(\'new\')">＋ START A GAME</button></div>';
  $('tab-games').innerHTML=h;
  $('tab-games').querySelectorAll('[data-open]').forEach(function(b){ b.onclick=function(){ openGame(+b.dataset.open); }; });
  $('tab-games').querySelectorAll('[data-acc]').forEach(function(b){ b.onclick=function(){ b.disabled=true; rpc('bg_accept',{p_id:+b.dataset.acc}).then(function(g){ showGame(g); }).catch(function(e){ toast(e.message); loadLobby(); }); }; });
  $('tab-games').querySelectorAll('[data-dec]').forEach(function(b){ b.onclick=function(){ b.disabled=true; rpc('bg_decline',{p_id:+b.dataset.dec}).then(loadLobby).catch(function(e){ toast(e.message); }); }; });
}
function renderNew(){
  var h='<div class="picks">'+Object.keys(GAMES).map(function(k){ var g=GAMES[k]; return '<button class="pick'+(k===NEWG?' on':'')+'" data-g="'+k+'" style="--gc:'+(g.c||'#8b5cf6')+'"><div class="pi">'+gIcon(k)+'</div><b>'+g.n+'</b><span>'+g.d+'</span></button>'; }).join('')+'</div>';
  h+='<div class="field"><input id="toWho" placeholder="Handle, or leave blank for anyone" autocomplete="off" autocapitalize="characters"></div>';

  $('tab-new').querySelectorAll('.pick').forEach(function(b){ b.onclick=function(){ NEWG=b.dataset.g; renderNew(); }; });
  $('sendCh').onclick=function(){ var to=$('toWho').value.trim()||'anyone', b=this; b.disabled=true;
    rpc('bg_new',{p_game:NEWG,p_to:to}).then(function(){ toast(to==='anyone'?'Posted — anyone can take it':'Challenge sent to '+to.toUpperCase()); setTab('games'); loadLobby(); })
    .catch(function(e){ toast(e.message); b.disabled=false; }); };
}
function loadBoard(){
  var h='<div class="chips">'+[['all','All games']].concat(Object.keys(GAMES).map(function(k){ return [k,GAMES[k].n]; })).map(function(c){ return '<button data-b="'+c[0]+'"'+(c[0]===BOARDG?' class="on"':'')+'>'+c[1]+'</button>'; }).join('')+'</div><div id="lbBody" class="empty">Loading…</div>';
  $('tab-board').innerHTML=h;
  $('tab-board').querySelectorAll('[data-b]').forEach(function(b){ b.onclick=function(){ BOARDG=b.dataset.b; loadBoard(); }; });
  rpc('bg_board',{p_game:BOARDG}).then(function(rows){
    var mine=L&&L.ratings&&BOARDG!=='all'?L.ratings[BOARDG]:null;
    if(!rows||!rows.length){ $('lbBody').innerHTML='No finished games yet. Be the first on the board.'; return; }
    $('lbBody').outerHTML='<table class="lb">'+rows.map(function(r,i){ return '<tr'+(r.h===ME?' class="me"':'')+'><td>'+(i<3?['🥇','🥈','🥉'][i]:'#'+(i+1))+'</td><td><b>'+esc(r.h)+'</b></td><td>'+(BOARDG==='all'?'avg ':'')+r.r+'</td><td>'+r.w+'–'+r.l+(r.d?'–'+r.d:'')+'</td></tr>'; }).join('')+'</table>'+
      (mine?'<p class="note">Your '+GAMES[BOARDG].n+' rating: <b style="color:var(--gold)">'+mine.r+'</b> · '+mine.w+'–'+mine.l+(mine.d?'–'+mine.d:'')+'</p>':'');
  }).catch(function(e){ $('lbBody').textContent=e.message; });
}

/* ───────────── game view ───────────── */
var UI={sel:null,path:null,tb:null,fleet:null,cur:0,dir:'h'};
function openGame(id){ rpc('bg_state',{p_id:id}).then(showGame).catch(function(e){ toast(e.message); }); }
function refreshGame(){ if(!G||busy) return; rpc('bg_state',{p_id:G.id}).then(function(g){ if(JSON.stringify(g.state)!==JSON.stringify(G.state)||g.status!==G.status||g.turn!==G.turn) showGame(g,true); }).catch(function(){}); }
window.SHK_SHELL_DEEP=function(){ return !!G; };
window.SHK_SHELL_BACK=function(){ if(G){ backToLobby(); return true; } return false; };
function backToLobby(){ G=null; $('game').style.display='none'; $('lobby').style.display=''; $('mainTop').style.display=''; try{ history.replaceState(null,'','/board-games.html'); }catch(e){} loadLobby(); }
function showGame(g,keep){
  var fresh=!G||G.id!==g.id; G=g; if(fresh){ UI={sel:null,path:null,tb:null,fleet:null,cur:0,dir:'h'}; }
  if(!keep&&fresh){ try{ history.replaceState(null,'','/board-games.html?g='+g.id); }catch(e){} }
  $('lobby').style.display='none'; $('mainTop').style.display='none'; var el=$('game'); el.style.display='block';
  var me=g.seat, p1on=g.status==='live'&&(g.turn===1||(g.turn===0&&!(g.game==='hang'?g.state.p1.done:g.state.fleetset&&g.state.fleetset['1'])));
  var p2on=g.status==='live'&&(g.turn===2||(g.turn===0&&!(g.game==='hang'?g.state.p2.done:g.state.fleetset&&g.state.fleetset['2'])));
  var col1=g.game==='c4'?'🟡 ':g.game==='checkers'?'⚪ ':'', col2=g.game==='c4'?'🔴 ':g.game==='checkers'?'🔴 ':'';
  if(g.game==='chess'&&g.state&&g.state.w){ col1=g.state.w===1?'⚪ ':'⚫ '; col2=g.state.w===2?'⚪ ':'⚫ '; }
  var h='<div class="top"><a href="#" id="gBack">← My games</a><span style="flex:1"></span><span style="color:var(--mut);font-weight:700">'+gIcon(g.game,'sm')+' '+esc(g.name)+'</span></div>';
  h+='<div class="ghead"><div class="pl'+(p1on?' on':'')+'"><b>'+col1+esc(g.p1)+(me===1?' (you)':'')+'</b><span>'+playerSub(g,1)+'</span></div><div class="vs">VS</div><div class="pl'+(p2on?' on':'')+'"><b>'+col2+esc(g.p2||'—')+(me===2?' (you)':'')+'</b><span>'+playerSub(g,2)+'</span></div></div>';
  h+='<div class="status" id="gStatus">'+statusLine(g)+'</div><div id="gBoard"></div>';
  h+='<div class="gfoot">'+(g.status==='live'&&me?'<button class="btn red" id="gResign">RESIGN</button>':'')+(g.status==='done'?'<button class="btn gold" id="gRematch">REMATCH</button>':'')+'<button class="btn ghost" id="gBack2">MY GAMES</button></div>';
  el.innerHTML=h;
  $('gBack').onclick=function(e){ e.preventDefault(); backToLobby(); }; $('gBack2').onclick=backToLobby;
  if($('gResign')) $('gResign').onclick=function(){ if(this.dataset.sure){ rpc('bg_resign',{p_id:g.id}).then(function(x){ showGame(x,true); }).catch(function(e){ toast(e.message); }); } else { this.dataset.sure=1; this.textContent='TAP AGAIN TO RESIGN'; } };
  if($('gRematch')) $('gRematch').onclick=function(){ var b=this; b.disabled=true; rpc('bg_new',{p_game:g.game,p_to:oppName(g)}).then(function(){ toast('Rematch sent to '+oppName(g)); backToLobby(); }).catch(function(e){ toast(e.message); b.disabled=false; }); };
  ({c4:drawC4,checkers:drawCK,ship:drawShip,hang:drawHang,chess:drawCH,dom:drawDOM})[g.game](g);
  if(g.status==='done') setTimeout(function(){ if(G&&G.id===g.id) endFx(g); }, 450);
  startPoll();
}
function endFx(g){
  if(!g||g.status!=='done'||!g.seat) return;
  var seen={}; try{ seen=JSON.parse(localStorage.getItem('shk_bg_endseen')||'{}'); }catch(e){}
  if(seen[g.id]) return;
  if(Date.now()-new Date(g.updated_at).getTime()>2*86400000) return;
  seen[g.id]=1; try{ var ks=Object.keys(seen); if(ks.length>200) ks.slice(0,ks.length-200).forEach(function(k){ delete seen[k]; }); localStorage.setItem('shk_bg_endseen',JSON.stringify(seen)); }catch(e){}
  var kind=g.winner===0?'draw':g.winner===g.seat?'win':'lose', opp=oppName(g);
  var art=kind==='win'?ART.trophy:kind==='lose'?ART.boat:ART.shake, emo=kind==='win'?'🏆':kind==='lose'?'🚣':'🤝';
  var t=kind==='win'?'YOU WON!':kind==='lose'?'GOOD GAME':'IT\'S A DRAW';
  var sub=kind==='win'?'You beat '+esc(opp)+' at '+esc(GAMES[g.game].n):kind==='lose'?esc(opp)+' took this one':'You and '+esc(opp)+' split it';
  var el=document.createElement('div'); el.id='endFx'; el.className=kind;
  el.innerHTML='<div class="ef-card">'+(art?'<img class="ef-art" alt="" src="'+art+'">':'<div class="ef-emo">'+emo+'</div>')+'<div class="ef-t">'+t+'</div><div class="ef-s">'+sub+(g.reason?' · '+esc(g.reason):'')+'</div>'+
    '<div class="ef-b"><button class="btn gold big shine" id="efRe">⚔️ REMATCH</button><button class="btn ghost big" id="efX">CLOSE</button></div></div>';
  if(kind==='win'){ var cols=['#fbbf24','#ef4444','#22c55e','#3b82f6','#a78bfa','#f472b6','#fff']; for(var i=0;i<70;i++){ var c=document.createElement('i'); c.className='cf';
    c.style.cssText='left:'+(Math.random()*100)+'%;background:'+cols[i%cols.length]+';animation-duration:'+(2.2+Math.random()*2.4)+'s;animation-delay:'+(Math.random()*1.2)+'s;--dx:'+(Math.random()*120-60)+'px;--r:'+(Math.random()*900-450)+'deg';
    el.appendChild(c); } }
  document.body.appendChild(el);
  try{ if(navigator.vibrate) navigator.vibrate(kind==='win'?[60,40,120]:40); }catch(e){}
  var close=function(){ el.remove(); };
  el.querySelector('#efX').onclick=close;
  el.querySelector('#efRe').onclick=function(){ var b=this; b.disabled=true; rpc('bg_new',{p_game:g.game,p_to:opp}).then(function(){ toast('Rematch sent to '+opp); close(); }).catch(function(e){ toast(e.message); b.disabled=false; }); };

function chPiece(p){ var w=chW(p), u=p.toUpperCase(), art=CH_ART&&CH_ART[(w?'w':'b')+u];
  return '<span class="cp '+(w?'w':'b')+'">'+(art?'<img alt="" src="'+art+'">':CH_G[u]+'︎')+'</span>'; }
function chTaken(g,s){ var b=g.state.b, w=g.state.w===s, start={P:8,N:2,B:2,R:2,Q:1}, out='';
  ['Q','R','B','N','P'].forEach(function(u){ var mine=w?u.toLowerCase():u, n=Math.max(0,start[u]-(b.split(mine).length-1)); for(var k=0;k<n;k++) out+=CH_G[u]+'︎'; });
  return out; }
function drawCH(g){
  chArtLoad();
  var st=g.state, b=st.b, w=st.w===g.seat, can=g.status==='live'&&g.my_turn, flip=g.seat&&!w;
  var legal=can?chMoves(b,st.c,st.ep,w):[], tg=[];
  if(can&&UI.sel!=null) tg=legal.filter(function(m){ return m[0]===UI.sel; }).map(function(m){ return m[1]; });
  var toMoveW=g.turn===st.w, ks=st.check&&g.status==='live'?b.indexOf(toMoveW?'K':'k'):-1, last=st.last||{};
  var h='<div class="chb">';
  for(var vr=0;vr<8;vr++) for(var vc=0;vc<8;vc++){
    var r=flip?7-vr:vr, c=flip?7-vc:vc, i=r*8+c, p=b[i], cls='sq '+((r+c)%2?'d':'l');
    if(i===last.f||i===last.t) cls+=' last'; if(i===UI.sel) cls+=' sel'; if(i===ks) cls+=' chk';
    if(tg.indexOf(i)>=0) cls+=' tgt'+(p!=='.'||(b[UI.sel]&&b[UI.sel].toUpperCase()==='P'&&(i&7)!==(UI.sel&7))?' cap':'');
    h+='<div class="'+cls+'" data-i="'+i+'">'+(vc===0?'<span class="co r">'+(8-r)+'</span>':'')+(vr===7?'<span class="co f">'+'abcdefgh'[c]+'</span>':'')+(p!=='.'?chPiece(p):'')+'</div>';
  }
  h+='</div>';
  if(UI.promo) h+='<div class="chpro">'+[['Q',4],['R',3],['B',2],['N',1]].map(function(x){ return '<button data-pr="'+x[1]+'">'+chPiece(w?x[0]:x[0].toLowerCase())+'</button>'; }).join('')+'</div><p class="note" style="text-align:center">Pick what your pawn becomes · <a href="#" id="chNo" style="color:var(--gold)">Undo</a></p>';
  else if(can&&!legal.length) h+='<p class="note" style="text-align:center">No legal moves.</p>';
  $('gBoard').innerHTML=h;
  if(UI.promo){
    $('gBoard').querySelectorAll('[data-pr]').forEach(function(x){ x.onclick=function(){ var m=UI.promo; UI.promo=null; send({f:m[0],t:m[1],p:+x.dataset.pr}); }; });
    $('chNo').onclick=function(e){ e.preventDefault(); UI.promo=null; UI.sel=null; drawCH(G); };
    return;
  }
  if(!can) return;
  $('gBoard').querySelectorAll('[data-i]').forEach(function(x){ x.onclick=function(){
    var i=+x.dataset.i, p=b[i];
    if(UI.sel!=null&&tg.indexOf(i)>=0){
      var f=UI.sel, mp=b[f];
      if(mp.toUpperCase()==='P'&&((i>>3)===0||(i>>3)===7)){ UI.promo=[f,i]; drawCH(G); return; }
      send({f:f,t:i}); return;
    }
    if(p!=='.'&&chW(p)===w){ UI.sel=(UI.sel===i?null:i); drawCH(G); return; }
    if(UI.sel!=null){ UI.sel=null; drawCH(G); }
  }; });
}

/* ───────────── dominoes ─────────────
   Draw game, double-six. A tile is a*10+b (a<=b). The table runs left to right; tap a tile in your hand to play it —
   if it fits both ends you pick the end. No tile fits: DRAW from the boneyard; boneyard empty: PASS. */
var DOM_PIPS={0:[],1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,1,2,6,7,8]};
function domHalf(n,vert){ var on=DOM_PIPS[n]||[], h='<div class="dh">';
  for(var k=0;k<9;k++){ var kk=vert?((k%3)*3+Math.floor(k/3)):k; h+='<i'+(on.indexOf(kk)>=0?' class="on"':'')+'></i>'; }
  return h+'</div>'; }
function domTile(a,b,cls,attr,vert){ return '<div class="dt'+(vert?' v':'')+(cls?' '+cls:'')+'"'+(attr||'')+'>'+domHalf(a,vert)+'<b class="dd"></b>'+domHalf(b,vert)+'</div>'; }
function domFits(t,L,R){ if(L==null) return ['S']; var a=Math.floor(t/10), b=t%10, out=[]; if(a===L||b===L) out.push('L'); if(a===R||b===R) out.push('R'); if(L===R&&out.length===2) out=['R']; return out; }
function drawDOM(g){
  var st=g.state, can=g.status==='live'&&g.my_turn, hand=(st.hand||[]).slice().sort(function(x,y){ return x-y; }), L=st.L, R=st.R, line=st.line||[];
  var opp=3-(g.seat||1), on=st['n'+opp]||0, fits={}, any=false;
  hand.forEach(function(t){ var f=domFits(t,L,R); fits[t]=f; if(f.length) any=true; });
  var last=st.last||{}, h='';
  h+='<div class="dinfo"><span>'+esc(oppName(g))+' holds <b>'+on+'</b></span><span>Boneyard <b>'+(st.yard||0)+'</b></span></div>';
  h+='<div class="dtable">';
  if(!line.length) h+='<div class="dempty">'+(can?'Lay down any tile to start':'The table is empty')+'</div>';
  else line.forEach(function(x,i){ var dbl=x[0]===x[1], cls=''; if(last.t!=null&&!last.draw&&!last.pass&&((last.end==='L'&&i===0)||(last.end==='R'&&i===line.length-1)||(last.end==='S'))) cls='new';
    if(UI.dsel!=null&&fits[UI.dsel]&&fits[UI.dsel].length>1){ if(i===0) cls+=' endL'; if(i===line.length-1) cls+=' endR'; }
    h+=domTile(x[0],x[1],cls,(i===0?' data-end="L"':'')+(i===line.length-1?' data-endr="R"':''),dbl); });
  h+='</div>';
  if(line.length) h+='<div class="dends"><span>◀ left end <b>'+L+'</b></span><span>right end <b>'+R+'</b> ▶</span></div>';
  if(g.status==='done'&&st.h1){ h+='<div class="gl">THEIR TILES</div><div class="dhand">'+(st['h'+opp]||[]).map(function(t){ return domTile(Math.floor(t/10),t%10,'dim'); }).join('')+'</div>'; }
  h+='<div class="gl">YOUR TILES</div><div class="dhand">'+(hand.length?hand.map(function(t){
    var f=fits[t]||[], cls=(can&&f.length?'ok':can?'dim':'')+(UI.dsel===t?' sel':'');
    return domTile(Math.floor(t/10),t%10,cls,' data-t="'+t+'"');
  }).join(''):'<div class="empty">No tiles left.</div>')+'</div>';
  if(can&&UI.dsel!=null&&fits[UI.dsel]&&fits[UI.dsel].length>1) h+='<div class="dpick"><button class="btn gold" data-e="L">◀ LEFT END</button><button class="btn gold" data-e="R">RIGHT END ▶</button></div>';
  if(can&&!any) h+='<div class="dpick">'+((st.yard||0)>0?'<button class="btn gold" id="dDraw">DRAW A TILE</button>':'<button class="btn" id="dPass">PASS</button>')+'</div><p class="note" style="text-align:center">'+((st.yard||0)>0?'Nothing fits — draw from the boneyard.':'Nothing fits and the boneyard is empty — pass.')+'</p>';
  $('gBoard').innerHTML=h;
  if(!can) return;
  $('gBoard').querySelectorAll('[data-t]').forEach(function(x){ x.onclick=function(){
    var t=+x.dataset.t, f=fits[t]||[];
    if(!f.length) return toast('That one doesn\'t fit either end');
    if(f.length===1){ UI.dsel=null; return send({t:t,end:f[0]==='S'?'R':f[0]}); }
    UI.dsel=(UI.dsel===t?null:t); drawDOM(G);
  }; });
  $('gBoard').querySelectorAll('[data-e]').forEach(function(x){ x.onclick=function(){ var t=UI.dsel; UI.dsel=null; send({t:t,end:x.dataset.e}); }; });
  if($('dDraw')) $('dDraw').onclick=function(){ send({draw:true}); };
  if($('dPass')) $('dPass').onclick=function(){ send({pass:true}); };
}

/* ───────────── sink the ship ───────────── */
var SHIPS=[[5,'Mega-ship'],[4,'Feeder'],[3,'Barge'],[3,'Tug'],[2,'Pilot boat']];
function cellsOf(sp){ var out=[]; for(var k=0;k<sp[2];k++) out.push(sp[3]==='h'?[sp[0],sp[1]+k]:[sp[0]+k,sp[1]]); return out; }
function fits(fl,idx,r,c,len,dir){ var occ={}; fl.forEach(function(sp,j){ if(sp&&j!==idx) cellsOf(sp).forEach(function(x){ occ[x[0]+','+x[1]]=1; }); });
  for(var k=0;k<len;k++){ var rr=dir==='h'?r:r+k, cc=dir==='h'?c+k:c; if(rr>9||cc>9||occ[rr+','+cc]) return false; } return true; }
function randomFleet(){ var fl=[]; SHIPS.forEach(function(s,j){ for(var t=0;t<500;t++){ var d=Math.random()<.5?'h':'v', r=Math.floor(Math.random()*10), c=Math.floor(Math.random()*10); if(fits(fl,j,r,c,s[0],d)){ fl[j]=[r,c,s[0],d]; break; } } }); return fl; }
function drawShip(g){
  var s=g.seat, st=g.state;
  if(g.status==='live'&&g.turn===0&&g.my_turn){ return drawSetup(g); }
  var opp=3-s, myShots=st['s'+s]||[], theirShots=st['s'+opp]||[], sunkOpp=st['sunk'+opp]||[], last=st.last;
  var shotMap={}; myShots.forEach(function(x){ shotMap[x[0]+','+x[1]]=x[2]; });
  var sunkSet={}; sunkOpp.forEach(function(sh){ sh.forEach(function(c){ sunkSet[c]=1; }); });
  var fleetOpp=g.status==='done'?(st['fleet'+opp]||[]):[], oppShip={}; fleetOpp.forEach(function(sh){ sh.forEach(function(c){ oppShip[c]=1; }); });
  var can=g.status==='live'&&g.my_turn&&g.turn===s;
  var h='<div class="gl">THEIR WATERS'+(can?' — TAP TO FIRE':'')+'</div><div class="grid" id="tw">';
  for(var r=0;r<10;r++) for(var c=0;c<10;c++){ var k=r+','+c, v=shotMap[k], cls=sunkSet[k]?'sunk':v===1?'hit':v===0?'miss':oppShip[k]?'ship':'';
    h+='<div class="g '+cls+(last&&last.by===s&&last.r===r&&last.c===c?' last':'')+'" data-r="'+r+'" data-c="'+c+'">'+(v===1||sunkSet[k]?'✕':'')+'</div>'; }
  h+='</div>';
  var mine={}; (st.myfleet||[]).forEach(function(sh){ sh.forEach(function(c){ mine[c]=1; }); });
  var theirMap={}; theirShots.forEach(function(x){ theirMap[x[0]+','+x[1]]=x[2]; });
  h+='<div class="gl">YOUR FLEET</div><div class="grid">';
  for(r=0;r<10;r++) for(c=0;c<10;c++){ k=r+','+c; v=theirMap[k]; h+='<div class="g '+(v===1?'hit':mine[k]?'ship':'')+(v===0?' miss':'')+(last&&last.by===opp&&last.r===r&&last.c===c?' last':'')+'">'+(v===1?'✕':'')+'</div>'; }
  h+='</div>';
  if(last&&last.sunk) h='<p class="note" style="text-align:center;color:var(--gold)">'+(last.by===s?'You sank a ship!':'They sank your ship!')+'</p>'+h;
  $('gBoard').innerHTML=h;
  if(can) $('tw').querySelectorAll('.g').forEach(function(x){ x.onclick=function(){ var r=+x.dataset.r, c=+x.dataset.c; if(shotMap[r+','+c]!==undefined) return toast('You already fired there'); send({r:r,c:c}); }; });
}
function drawSetup(g){
  if(!UI.fleet) UI.fleet=[];
  var fl=UI.fleet, occ={}; fl.forEach(function(sp,j){ if(sp) cellsOf(sp).forEach(function(x){ occ[x[0]+','+x[1]]=j; }); });
  var h='<p class="note" style="text-align:center">Pick a ship, then tap where its front goes. Tap a placed ship to move it.</p><div class="fleetbar">'+
    SHIPS.map(function(s,j){ return '<button data-s="'+j+'" class="'+(j===UI.cur?'on':'')+(fl[j]?' done':'')+'">'+s[1]+' ('+s[0]+')</button>'; }).join('')+'</div>';
  h+='<div class="grid" id="sg">';
  for(var r=0;r<10;r++) for(var c=0;c<10;c++){ var k=r+','+c; h+='<div class="g'+(occ[k]!==undefined?' ship'+(occ[k]===UI.cur?' pv':''):'')+'" data-r="'+r+'" data-c="'+c+'"></div>'; }
  h+='</div><div class="gfoot"><button class="btn ghost" id="rot">↻ '+(UI.dir==='h'?'ACROSS':'DOWN')+'</button><button class="btn ghost" id="rnd">🎲 RANDOM</button><button class="btn gold" id="rdy"'+(fl.filter(Boolean).length===5?'':' disabled')+'>READY</button></div>';
  $('gBoard').innerHTML=h;
  $('gBoard').querySelectorAll('[data-s]').forEach(function(b){ b.onclick=function(){ UI.cur=+b.dataset.s; drawSetup(g); }; });
  $('rot').onclick=function(){ UI.dir=UI.dir==='h'?'v':'h'; var sp=fl[UI.cur]; if(sp&&fits(fl,UI.cur,sp[0],sp[1],sp[2],UI.dir)) fl[UI.cur]=[sp[0],sp[1],sp[2],UI.dir]; drawSetup(g); };
  $('rnd').onclick=function(){ UI.fleet=randomFleet(); drawSetup(g); };
  $('rdy').onclick=function(){ send({fleet:UI.fleet}); };
  $('sg').querySelectorAll('.g').forEach(function(x){ x.onclick=function(){ var r=+x.dataset.r, c=+x.dataset.c, k=r+','+c;
    if(occ[k]!==undefined&&occ[k]!==UI.cur){ UI.cur=occ[k]; UI.dir=fl[UI.cur][3]; drawSetup(g); return; }
    var len=SHIPS[UI.cur][0]; if(!fits(fl,UI.cur,r,c,len,UI.dir)) return toast('It doesn\'t fit there');
    fl[UI.cur]=[r,c,len,UI.dir]; var nx=SHIPS.findIndex(function(s,j){ return !fl[j]; }); if(nx>=0) UI.cur=nx; drawSetup(g); }; });
}

/* ───────────── dock words ───────────── */
function hookSvg(miss){
  // a crane lowers its hook one step per miss; on the 7th miss the load hits the deck
  var drop=12+miss*13, parts='';
  parts+='<line x1="30" y1="160" x2="170" y2="160" stroke="#64748b" stroke-width="4"/>';
  parts+='<line x1="45" y1="160" x2="45" y2="18" stroke="#fbbf24" stroke-width="6"/><line x1="40" y1="20" x2="160" y2="20" stroke="#fbbf24" stroke-width="6"/>';
  parts+='<line x1="45" y1="50" x2="75" y2="20" stroke="#fbbf24" stroke-width="3"/>';
  parts+='<line x1="140" y1="20" x2="140" y2="'+(20+drop)+'" stroke="#cbd5e1" stroke-width="2"/>';
  parts+='<path d="M134 '+(20+drop)+' h12 v6 a8 8 0 1 1 -8 8" fill="none" stroke="#e2e8f0" stroke-width="3"/>';
  var boxY=20+drop+16; if(boxY>132) boxY=132;
  parts+='<rect x="115" y="'+boxY+'" width="50" height="26" rx="2" fill="'+(miss>=7?'#dc2626':'#2563eb')+'" stroke="#0f172a" stroke-width="2"/>';
  for(var i=0;i<4;i++) parts+='<line x1="'+(122+i*11)+'" y1="'+(boxY+3)+'" x2="'+(122+i*11)+'" y2="'+(boxY+23)+'" stroke="#0f172a55" stroke-width="2"/>';
  return '<svg class="hangsvg" viewBox="0 0 200 170" aria-label="'+miss+' misses">'+parts+'</svg>';
}
function hookScene(me,st){
  var miss=me.miss||0, max=st.max||7, X=57, top, lost=me.done&&!me.won, won=me.done&&me.won;
  top=won?19:lost?50:19+Math.min(1,miss/max)*27;
  var prev=(UI.hookTop!=null&&UI.hookFor===G.id)?UI.hookTop:top; UI.hookTop=top; UI.hookFor=G.id;
  var h='<div class="hscene'+(lost?' lost':won?' won':'')+'" id="hScene">';
  h+='<div class="hchain" style="left:'+X+'%;height:'+(prev-18+1)+'%" data-h="'+(top-18+1)+'"></div>';
  h+='<img class="hcrate" alt="" src="'+ART.crate+'" style="left:'+X+'%;top:'+prev+'%" data-t="'+top+'">';
  if(lost&&ART.miss) h+='<img class="hsplash" alt="" src="'+ART.miss+'" style="left:'+X+'%">';
  if(won) h+='<div class="hbadge">✨ LOAD SAVED</div>'; else if(lost) h+='<div class="hbadge">SPLASH! 💦</div>';
  h+='<div class="hmeter">'+miss+' / '+max+'</div></div>';
  requestAnimationFrame(function(){ requestAnimationFrame(function(){ var sc=document.getElementById('hScene'); if(!sc) return;
    var c=sc.querySelector('.hcrate'), ch=sc.querySelector('.hchain'); if(c) c.style.top=c.dataset.t+'%'; if(ch) ch.style.height=ch.dataset.h+'%'; }); });
  return h;
}
function drawHang(g){
  var s=g.seat, st=g.state, me=st['p'+s]||{}, op=st['p'+(3-s)]||{}, guesses=me.g||'', mask=me.mask||'', can=g.status==='live'&&g.my_turn;
  var h=ART.crate?hookScene(me,st):hookSvg(me.miss||0);
  var ml=st.len||8, mfs=ml>13?17:ml>10?21:ml>8?25:30, mls=ml>10?3:6;
  h+='<div class="mask" style="font-size:'+mfs+'px;letter-spacing:'+mls+'px">'+esc((g.status==='done'?(st.word||mask):mask).split('').join(' '))+'</div>';
  h+='<div class="hint">Hint: '+esc(st.hint||'')+' · '+st.len+' letters · '+(me.miss||0)+'/'+st.max+' misses</div>';
  if(me.done&&g.status!=='done') h+='<p class="note" style="text-align:center;color:var(--gold)">'+(me.won?'You solved it with '+me.miss+' miss'+(me.miss===1?'':'es')+'!':'Out of tries.')+' Waiting on '+esc(oppName(g))+'…</p>';
  h+='<div class="kb">';
  'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(function(ch){ var used=guesses.indexOf(ch)>=0, hit=used&&mask.indexOf(ch)>=0;
    h+='<button data-l="'+ch+'"'+(used||!can?' disabled':'')+' class="'+(used?(hit?'hit':'miss'):'')+'">'+ch+'</button>'; });
  h+='</div>';
  if(g.status!=='done'&&op) h+='<div class="opp">'+esc(oppName(g))+': '+(op.done?(op.won?'solved it':'out of tries'):'found '+(op.found||0)+'/'+st.len+' letters')+' · '+(op.miss||0)+' misses</div>';
  if(g.status==='done'&&op&&op.g!=null) h+='<div class="opp">'+esc(oppName(g))+' guessed: '+esc(op.g.split('').join(' '))+'</div>';
  $('gBoard').innerHTML=h;
  if(can) $('gBoard').querySelectorAll('[data-l]').forEach(function(b){ b.onclick=function(){ send({letter:b.dataset.l}); }; });
}
</script>
