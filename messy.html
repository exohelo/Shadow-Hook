<!-- #messy2(nov24) — MESSY, rebuilt. The 1-hour, 1-on-1, 10-minute format never got two people on the dock at once
     (117 searches, 0 dates). Now:
       SWIPE   anytime: avatar cards with 3 fun answers. A mutual like = a match (msy_swipe). Whoever liked you shows first.
       MATCHES chat that waits for you (msy_thread/msy_send, gone after 14 days), with 🎲 This-or-That / Would-you-rather.
       PARTY   one live room on the pier (realtime presence + broadcast, nothing stored): party games run themselves —
               Would You Rather, Most Likely To, Hot Seat — and 🍹 slide a drink to anyone; if they take it, you match.

var SIGNED={};
function signed(path){ if(SIGNED[path]&&SIGNED[path].t>Date.now()) return Promise.resolve(SIGNED[path].u);
  return sb.storage.from('msy-photos').createSignedUrl(path,900).then(function(r){ if(r.error) throw r.error; SIGNED[path]={u:r.data.signedUrl,t:Date.now()+800000}; return r.data.signedUrl; }); }
function shrink(file){ return new Promise(function(res,rej){ var img=new Image(), u=URL.createObjectURL(file);
  img.onload=function(){ var m=1000, w=img.naturalWidth, h=img.naturalHeight, k=Math.min(1,m/Math.max(w,h)), c=document.createElement('canvas'); c.width=Math.round(w*k); c.height=Math.round(h*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(u); c.toBlob(function(b){ b?res(b):rej(new Error('could not read that photo')); },'image/jpeg',.84); };
  img.onerror=function(){ rej(new Error('could not read that photo')); }; img.src=u; }); }
function pickPhoto(){ return new Promise(function(res){ var i=document.createElement('input'); i.type='file'; i.accept='image/*'; i.onchange=function(){ res(i.files&&i.files[0]); }; i.click(); }); }
function uploadPhoto(){
  return pickPhoto().then(function(f){ if(!f) return null; toast('Uploading…');
    return shrink(f).then(function(blob){ var path=ME.key+'/'+Math.random().toString(36).slice(2,10)+'.jpg', old=INFO.photo;
      return sb.storage.from('msy-photos').upload(path,blob,{contentType:'image/jpeg',upsert:false}).then(function(r){ if(r.error) throw r.error;
        return rpc('msy_photo_set',{p_path:path}); }).then(function(){ INFO.photo=path; if(old) sb.storage.from('msy-photos').remove([old]).then(function(){},function(){}); toast('✓ Photo saved — private until you both say yes'); return path; }); }); })
    .catch(function(e){ toast(e.message||'upload failed'); return null; });
}
function removePhoto(){ var old=INFO.photo; return rpc('msy_photo_set',{p_path:null}).then(function(){ INFO.photo=null; if(old) sb.storage.from('msy-photos').remove([old]).then(function(){},function(){}); toast('Photo removed everywhere'); }); }
function paintReveal(){
  var R=$('cRev'); if(!R||!CHAT) return; var v=CHAT.reveal||{}, T=CHAT.them||{}, nm=esc(T.alias||'them'), h='';
  if(v.me&&v.them&&v.their_photo){
    h='<div class="rev"><div class="ph blur" id="rvPh"></div><div class="rt"><b>📸 Photos revealed</b>You both said yes. Tap to see '+nm+'.</div><div class="btns"><button class="sbtn" id="rvOff">Hide mine</button></div></div>';
  } else if(v.me&&v.them){ h='<div class="rev"><div class="rt"><b>📸 Almost there</b>'+(v.my_photo?'Waiting on '+nm+'\'s photo…':'Add your photo to finish the reveal.')+'</div><div class="btns">'+(v.my_photo?'':'<button class="sbtn pk" id="rvAdd">Add photo</button>')+'<button class="sbtn" id="rvOff">Take back</button></div></div>';
  } else if(v.me){ h='<div class="rev"><div class="rt"><b>📸 You\'re in</b>Waiting on '+nm+' to say yes. Nobody sees anything until you both do.</div><div class="btns"><button class="sbtn" id="rvOff">Take back</button></div></div>';
  } else if(v.them){ h='<div class="rev" style="border-color:#ffd36b"><div class="rt"><b>📸 '+nm+' wants to reveal photos</b>Only if you say yes too. You can take it back any time.</div><div class="btns"><button class="sbtn pk" id="rvOn">I\'m in</button></div></div>';
  } else { h='<div class="rev"><div class="rt"><b>📸 Photo reveal</b>Both of you say yes, then you both see each other. Not before.</div><div class="btns"><button class="sbtn pk" id="rvOn">I\'m in</button></div></div>'; }
  R.innerHTML=h;
  if($('rvOn')) $('rvOn').onclick=function(){ var b=this; b.disabled=true; (INFO.photo?Promise.resolve(INFO.photo):uploadPhoto()).then(function(p){ if(!p){ b.disabled=false; return; } return setReveal(true); }); };
  if($('rvAdd')) $('rvAdd').onclick=function(){ uploadPhoto().then(function(p){ if(p) pullChat(false); }); };
  if($('rvOff')) $('rvOff').onclick=function(){ if(!this.dataset.s){ this.dataset.s=1; this.textContent='Tap again'; return; } setReveal(false); };
  if($('rvPh')) signed(v.their_photo).then(function(u){ var ph=$('rvPh'); if(!ph) return; ph.style.backgroundImage='url('+u+')'; ph.onclick=function(){ ph.classList.remove('blur'); viewPhoto(u,T.alias); }; }).catch(function(){ });
}
function setReveal(on){ if(!CHAT) return; return rpc('msy_reveal',{p_match:CHAT.id,p_on:on}).then(function(t){ CHAT.reveal=t.reveal; paintReveal(); pullChat(false); if(on&&t.reveal.them) buzz([40,40,120]); }).catch(function(e){ toast(e.message); paintReveal(); }); }
function viewPhoto(u,who){ var v=document.createElement('div'); v.className='viewer'; v.innerHTML='<img alt=""><p>'+esc(who||'')+' · shared because you both said yes. Be decent — screenshots happen, respect goes further.</p><button class="btn">Close</button>'; v.querySelector('img').src=u; v.onclick=function(){ v.remove(); }; document.body.appendChild(v); }

/* ───────── PARTY (live room, nothing stored) ───────── */
var P=null;
function drawParty(){
  if(!INFO||!INFO.ready){ $('view').innerHTML='<div class="party" style="background-image:url('+ART.party+')"><div class="ph"><b>The Party 🎉</b></div><div class="stage"><div class="gq">Make your card first</div><p style="margin:0 0 12px;color:var(--mut)">You show up at the party as your Messy look and name.</p><button class="btn pk" onclick="go(\'me\')">Make my card</button></div></div>'; return; }
  $('view').innerHTML='<div class="party" style="background-image:url('+ART.party+')"><div class="ph"><b>The Party 🎉</b><span class="pill" id="pCount">joining…</span></div>'+
    '<div class="crowd" id="pCrowd"></div><div class="stage" id="pStage"></div><div class="feed" id="pFeed"></div>'+
    '<div class="pin"><input id="pIn" maxlength="140" placeholder="Say something to the room…" autocomplete="off"><button id="pSend">Send</button></div></div>';
  joinParty();
}
function joinParty(){
  if(P&&P.ch) return paintParty();
  P={ch:null,people:{},game:null,votes:{},asks:[],answers:{},feed:[],mine:{},timer:null,hostT:null,lastSay:0,rot:0};
  var key=ME.key;
  var ch=sb.channel('msy-party',{config:{presence:{key:key},broadcast:{self:false}}});
  P.ch=ch;
  ch.on('presence',{event:'sync'},function(){ var st=ch.presenceState(), ppl={}; Object.keys(st).forEach(function(k){ var m=st[k][0]; if(m) ppl[k]=m; }); P.people=ppl; paintParty(); hostTick(); });
  ch.on('presence',{event:'join'},function(x){ var m=x.newPresences&&x.newPresences[0]; if(m&&x.key!==key) feedLine(null,(m.alias||'Someone')+' walked onto the pier 👋'); });
  ch.on('broadcast',{event:'m'},function(x){ onParty(x.payload||{}); });
  ch.subscribe(function(s){ if(s==='SUBSCRIBED'){ ch.track({alias:ME.alias,av:ME.av,at:Date.now()}); ch.send({type:'broadcast',event:'m',payload:{t:'hello'}}); } });
  $('pSend').onclick=sayParty; $('pIn').onkeydown=function(e){ if(e.key==='Enter') sayParty(); };
  P.hostT=setInterval(hostTick,1000); rpc('msy_log',{p_kind:'party'}).catch(function(){});
}
function leaveParty(){ if(!P) return; try{ P.ch&&sb.removeChannel(P.ch); }catch(e){} clearInterval(P.hostT); P=null; }
function bcast(p){ if(P&&P.ch) P.ch.send({type:'broadcast',event:'m',payload:p}); }
function amHost(){ var ks=Object.keys(P.people); if(!ks.length) return false; ks.sort(function(a,b){ return (P.people[a].at||0)-(P.people[b].at||0)||(a<b?-1:1); }); return ks[0]===ME.key; }
function feedLine(who,text){ P.feed.push({w:who,t:text}); if(P.feed.length>60) P.feed.shift(); var F=$('pFeed'); if(!F) return;
  F.innerHTML=P.feed.map(function(l){ return '<div class="fl'+(l.w?'':' s')+'">'+(l.w?'<b>'+esc(l.w)+'</b> ':'')+esc(l.t)+'</div>'; }).join(''); F.scrollTop=F.scrollHeight; }
function sayParty(){ var i=$('pIn'), t=i.value.trim(); if(!t) return; if(Date.now()-P.lastSay<1500) return toast('Easy — one at a time'); P.lastSay=Date.now(); i.value='';
  if(P.answering&&P.game&&P.game.seat===ME.key){ var qid=P.answering; P.answering=null; i.placeholder='Say something to the room…'; P.answers[qid]=t.slice(0,120); bcast({t:'answer',g:P.game.id,q:qid,x:t.slice(0,120)}); paintStage(); return; }
  if(P.game&&P.game.kind==='hot'&&P.game.seat!==ME.key&&!P.game.done){ var q={id:Math.random().toString(36).slice(2,8),text:t.slice(0,120),from:ME.alias}; P.asks.push(q); bcast({t:'ask',g:P.game.id,q:q}); paintStage(); feedLine(null,'You asked the hot seat a question'); return; }
  bcast({t:'say',a:ME.alias,x:t.slice(0,140)}); feedLine(ME.alias,t.slice(0,140)); }
function onParty(m){
  if(!P) return;
  if(m.t==='say') feedLine(m.a,String(m.x||'').slice(0,140));
  else if(m.t==='hello'){ if(amHost()&&P.game&&!P.game.done) bcast({t:'game',g:P.game}); }
  else if(m.t==='game'){ if(!P.game||P.game.id!==m.g.id){ P.game=m.g; P.votes={}; P.asks=[]; P.answers={}; P.mine={}; buzz(10); } paintStage(); }
  else if(m.t==='vote'){ if(P.game&&m.g===P.game.id){ P.votes[m.k]=m.p; paintStage(); } }
  else if(m.t==='reveal'){ if(P.game&&m.g===P.game.id){ P.game.done=true; if(m.votes) P.votes=m.votes; paintStage(); } }
  else if(m.t==='ask'){ if(P.game&&m.g===P.game.id){ P.asks.push(m.q); paintStage(); } }
  else if(m.t==='answer'){ if(P.game&&m.g===P.game.id){ P.answers[m.q]=m.x; paintStage(); var q=P.asks.filter(function(a){ return a.id===m.q; })[0]; feedLine(null,'🔥 '+P.game.alias+' answered: “'+(q?q.text:'')+'” → '+m.x); } }
}
/* the host (whoever's been here longest) runs the games: a new one every ~35s, a reveal at 20s */
function hostTick(){
  if(!P||!amHost()) return; var n=Object.keys(P.people).length, now=Date.now(), g=P.game;
  if(n<2){ if(g&&!g.done){ g.done=true; bcast({t:'reveal',g:g.id,votes:P.votes}); paintStage(); } return; }
  if(g&&!g.done&&now>=g.ends){ g.done=true; bcast({t:'reveal',g:g.id,votes:P.votes}); paintStage(); return; }
  if(!g||(g.done&&now>=g.ends+12000)){
    var kinds=n>=3?['wyr','mlt','hot']:['wyr','mlt'], kind=kinds[P.rot++%kinds.length], id=Math.random().toString(36).slice(2,9), ng={id:id,kind:kind,ends:now+(kind==='hot'?60000:20000)};
    if(kind==='wyr'){ var w=pick(WYR); ng.q='Would you rather…'; ng.opts=[w[0],w[1]]; }
    if(kind==='mlt'){ ng.q=pick(MLT)+'…'; var ks=Object.keys(P.people).sort(function(){ return Math.random()-.5; }).slice(0,6); ng.opts=ks.map(function(k){ return P.people[k].alias; }); ng.keys=ks; }
    if(kind==='hot'){ var ks2=Object.keys(P.people), s=pick(ks2); ng.seat=s; ng.alias=P.people[s].alias; ng.av=P.people[s].av; ng.q=ng.alias+' is in the hot seat 🔥'; }
    P.game=ng; P.votes={}; P.asks=[]; P.answers={}; P.mine={}; bcast({t:'game',g:ng}); paintStage();
  }
}
function paintParty(){
  if(!P||TAB!=='party') return; var ks=Object.keys(P.people);
  if($('pCount')) $('pCount').textContent=ks.length+' here';
  var C=$('pCrowd'); if(C){ C.innerHTML=ks.map(function(k){ var p=P.people[k]; return '<button data-pk="'+esc(k)+'">'+av(p.av,50)+'<span>'+(k===ME.key?'You':esc(p.alias))+'</span></button>'; }).join('');
    [].forEach.call(C.querySelectorAll('[data-pk]'),function(b){ b.onclick=function(){ personSheet(b.dataset.pk); }; }); }
  paintStage();
}
function paintStage(){
  var S=$('pStage'); if(!S||!P) return; var g=P.game, n=Object.keys(P.people).length;
  if(!g){ S.innerHTML='<div class="gt">Party games</div><div class="gq">'+(n<2?'Waiting for one more person…':'Starting a game…')+'</div><div style="color:var(--mut);font-size:14px">Games start on their own once 2 people are here: Would You Rather, Most Likely To, and the Hot Seat (3+). Tap anyone up top to slide them a drink 🍹</div>'; return; }
  var left=Math.max(0,g.ends-Date.now()), pct=g.done?0:Math.min(100,left/(g.kind==='hot'?600:200));
  var h='<div class="gt">'+({wyr:'Would you rather',mlt:'Most likely to',hot:'Hot seat'})[g.kind]+(g.done?' · results':'')+'</div><div class="gq">'+esc(g.kind==='wyr'?'Pick one':g.q)+'</div>';
  if(g.kind==='wyr'||g.kind==='mlt'){
    var tally=g.opts.map(function(){ return 0; }), tot=0; Object.keys(P.votes).forEach(function(k){ var v=P.votes[k]; if(v>=0&&v<tally.length){ tally[v]++; tot++; } });
    var mine=P.votes[ME.key], best=Math.max.apply(null,tally);
    h+='<div class="opts">'+g.opts.map(function(o,i){ var show=g.done||mine!=null, w=show&&tot?Math.round(tally[i]/tot*100):0;
      return '<button class="opt'+(mine===i?' mine':'')+'" data-v="'+i+'"'+(mine!=null||g.done?' disabled':'')+'><i class="bar" style="width:'+w+'%"></i><span>'+(g.done&&tally[i]===best&&best>0?'👑 ':'')+esc(o)+'</span>'+(show?'<em>'+w+'%</em>':'')+'</button>'; }).join('')+'</div>';
  }
  if(g.kind==='hot'){
    var meSeat=g.seat===ME.key;
    h+='<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">'+av(g.av,48)+'<div style="font-size:14px;color:var(--mut)">'+(meSeat?'That\'s you! Questions show up below — tap one to answer.':'Type a question below — it goes to '+esc(g.alias)+' anonymously.')+'</div></div>';
    h+=P.asks.slice(-5).map(function(q){ var a=P.answers[q.id]; return '<div class="pr" style="margin-bottom:6px;padding:9px 12px"><div class="q">'+esc(q.text)+'</div>'+(a?'<div class="a">'+esc(a)+'</div>':meSeat&&!g.done?'<button class="sbtn pk" data-ans="'+esc(q.id)+'" style="margin-top:6px">Answer</button>':'')+'</div>'; }).join('')||'<div style="font-size:14px;color:var(--mut)">No questions yet…</div>';
  }
  h+='<div class="tm"><i style="width:'+pct+'%"></i></div>';
  S.innerHTML=h;
  [].forEach.call(S.querySelectorAll('[data-v]'),function(b){ b.onclick=function(){ var v=+b.dataset.v; P.votes[ME.key]=v; bcast({t:'vote',g:g.id,k:ME.key,p:v}); buzz(8); paintStage(); }; });
  [].forEach.call(S.querySelectorAll('[data-ans]'),function(b){ b.onclick=function(){ P.answering=b.dataset.ans; var i=$('pIn'); i.placeholder='Your answer…'; i.focus(); }; });
  clearTimeout(P.stT); if(!g.done) P.stT=setTimeout(paintStage,1000);
}
function personSheet(k){
  var p=P&&P.people[k]; if(!p) return;
  var s=document.createElement('div'); s.className='sheet';
  s.innerHTML='<div style="text-align:center">'+'<div style="display:flex;justify-content:center">'+av(p.av,110)+'</div><b style="display:block;font:700 24px Fredoka;margin:8px 0 14px">'+esc(k===ME.key?'You':p.alias)+'</b>'+
    (k===ME.key?'<button class="btn wide" id="psX">Looking good 😎</button>':'<button class="btn pk wide" id="psD">🍹 Slide a drink</button><div style="height:8px"></div><button class="btn gh wide" id="psR" style="background:#e11d4814;color:#be123c">Report</button><div style="height:8px"></div><button class="btn wide" id="psX">Close</button>')+'</div>';
  document.body.appendChild(s);
  $('psX').onclick=function(){ s.remove(); };
  if($('psD')) $('psD').onclick=function(){ var b=this; b.disabled=true; rpc('msy_swipe',{p_key:k,p_like:true,p_drink:true}).then(function(r){ s.remove(); if(r.match) showMatch(r.match,r.them); else { toast('🍹 Drink sent to '+p.alias+'. If they take it, you match.'); bcast({t:'say',a:'🍹',x:ME.alias+' slid '+p.alias+' a drink'}); feedLine('🍹',ME.alias+' slid '+p.alias+' a drink'); } }).catch(function(e){ toast(e.message); b.disabled=false; }); };
  if($('psR')) $('psR').onclick=function(){ if(!this.dataset.s){ this.dataset.s=1; this.textContent='Tap again to report'; return; } rpc('msy_report',{p_key:k,p_where:'party'}).then(function(){ s.remove(); toast('Reported. Thanks for keeping it good.'); }).catch(function(e){ toast(e.message); }); };
}
</script>
