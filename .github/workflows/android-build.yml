# Builds the Shadow Hook Android app on GitHub's Linux machine.
# Run it by hand: GitHub → Actions → "Android build" → Run workflow.
# Output (Actions run → Artifacts): shadow-hook.apk to install on a phone for testing, shadow-hook.aab for Google Play.
#
# Same Capacitor shell as the iPhone app (ios-app/), around the live site. Push uses Firebase (ios-app/android/google-services.json).
# Signing: one upload key, made on the first run and kept in the Supabase km_secrets vault (service role only), so every
# build is signed the same way — Google Play refuses updates signed with a different key.
name: Android build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ios-app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor (Android)
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund @capacitor/android@8.6.0

      - name: Create the Android project
        run: |
          # the repo keeps Firebase's settings in android/; set it aside so "cap add" gets an empty folder
          if [ -f android/google-services.json ]; then mv android/google-services.json "$RUNNER_TEMP/gs.json"; fi
          rmdir android 2>/dev/null || true
          npx cap add android
          npx cap sync android
          if [ -f "$RUNNER_TEMP/gs.json" ]; then cp "$RUNNER_TEMP/gs.json" android/app/google-services.json; echo "Firebase settings in place (push on)"; else echo "::warning::no google-services.json - push will not work"; fi

      - name: Home-screen widgets
        run: |
          A=android/app/src/main
          W=android-widgets
          if [ ! -d "$W/java" ] && [ -d "$W/android-widgets/java" ]; then W="$W/android-widgets"; fi   # uploaded one folder deep
          echo "widgets from ios-app/$W"
          mkdir -p "$A/java/com/theshadowhook/app" "$A/res/layout" "$A/res/xml" "$A/res/drawable"
          cp "$W"/java/*.java "$A/java/com/theshadowhook/app/"
          cp "$W"/res/layout/*.xml "$A/res/layout/"
          cp "$W"/res/xml/*.xml "$A/res/xml/"
          cp "$W"/res/drawable/*.xml "$A/res/drawable/"
          python3 "$W/patch_manifest.py" "$A/AndroidManifest.xml"

      - name: App icon
        run: |
          RES=android/app/src/main/res
          IM=$(command -v magick || command -v convert || true)
          if [ -z "$IM" ]; then sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq imagemagick >/dev/null; IM=$(command -v magick || command -v convert); fi
          rm -rf "$RES"/mipmap-anydpi-v26
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; s=${d##*:}
            mkdir -p "$RES/mipmap-$n"
            "$IM" resources/AppIcon-1024.png -resize ${s}x${s} "$RES/mipmap-$n/ic_launcher.png"
            cp "$RES/mipmap-$n/ic_launcher.png" "$RES/mipmap-$n/ic_launcher_round.png"
            rm -f "$RES/mipmap-$n/ic_launcher_foreground.png"
          done

      - name: Version
        run: |
          G=android/app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.0\"/" "$G"
          grep -E "applicationId|versionCode|versionName" "$G"

      - name: Signing key
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -e
          U="${SUPABASE_URL%/}/rest/v1/km_secrets"
          H1="apikey: $SUPABASE_SERVICE_KEY"; H2="Authorization: Bearer $SUPABASE_SERVICE_KEY"
          KS="$RUNNER_TEMP/upload.jks"
          ROWS=$(curl -fsS -H "$H1" -H "$H2" "$U?select=name,value&name=in.(android_upload_jks,android_upload_pw)")
          JKS=$(echo "$ROWS" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s);const o={};r.forEach(x=>o[x.name]=x.value);process.stdout.write(o.android_upload_jks||"")})')
          PW=$(echo "$ROWS" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s);const o={};r.forEach(x=>o[x.name]=x.value);process.stdout.write(o.android_upload_pw||"")})')
          if [ -n "$JKS" ] && [ -n "$PW" ]; then
            echo "$JKS" | base64 -d > "$KS"; echo "upload key: reusing the one in the vault"
          else
            PW=$(openssl rand -hex 16)
            keytool -genkeypair -v -keystore "$KS" -storetype JKS -alias upload -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass "$PW" -keypass "$PW" -dname "CN=Shadow Hook, O=The Order of The Shadow Hook, C=US" >/dev/null
            B64=$(base64 -w0 "$KS"); NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            printf '[{"name":"android_upload_jks","value":"%s","set_at":"%s"},{"name":"android_upload_pw","value":"%s","set_at":"%s"}]' "$B64" "$NOW" "$PW" "$NOW" > "$RUNNER_TEMP/k.json"
            curl -fsS -X POST -H "$H1" -H "$H2" -H "Content-Type: application/json" -H "Prefer: resolution=merge-duplicates,return=minimal" \
              "$U?on_conflict=name" --data-binary @"$RUNNER_TEMP/k.json"
            rm -f "$RUNNER_TEMP/k.json"; echo "upload key: made a new one and stored it in the vault"
          fi
          echo "::add-mask::$PW"
          echo "KS=$KS" >> "$GITHUB_ENV"; echo "KSPW=$PW" >> "$GITHUB_ENV"
          keytool -list -keystore "$KS" -storepass "$PW" | grep -i fingerprint || true

      - name: Build
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Sign
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          OUT="$RUNNER_TEMP/out"; mkdir -p "$OUT"
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          "$BT/zipalign" -f -p 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$KS" --ks-pass env:KSPW --ks-key-alias upload --out "$OUT/shadow-hook.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify "$OUT/shadow-hook.apk" && echo "APK signed"
          cp android/app/build/outputs/bundle/release/app-release.aab "$OUT/shadow-hook.aab"
          jarsigner -keystore "$KS" -storepass:env KSPW -keypass:env KSPW "$OUT/shadow-hook.aab" upload >/dev/null && echo "AAB signed"
          ls -la "$OUT"

      - name: Publish for the setup page (theshadowhook.com/get)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          U="${SUPABASE_URL%/}/storage/v1/object/downloads"
          for f in shadow-hook.apk; do
            curl -fsS -X POST "$U/$f" -H "apikey: $SUPABASE_SERVICE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
              -H "x-upsert: true" -H "Content-Type: application/vnd.android.package-archive" --data-binary @"$RUNNER_TEMP/out/$f" >/dev/null
          done
          printf '{"build":%s,"at":"%s"}' "${{ github.run_number }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$RUNNER_TEMP/android.json"
          curl -fsS -X POST "$U/android.json" -H "apikey: $SUPABASE_SERVICE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "x-upsert: true" -H "Content-Type: application/octet-stream" --data-binary @"$RUNNER_TEMP/android.json" >/dev/null
          echo "published: ${SUPABASE_URL%/}/storage/v1/object/public/downloads/shadow-hook.apk (build ${{ github.run_number }})"

      - uses: actions/upload-artifact@v4
        with:
          name: shadow-hook-android-${{ github.run_number }}
          path: ${{ runner.temp }}/out/
          retention-days: 30

      - name: Clean up
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" "$RUNNER_TEMP/aligned.apk"
