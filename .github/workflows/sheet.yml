name: sheet-worker
on:
  schedule:
    # #aug12 — DST-proof: run BOTH offsets so it never needs a Nov/Mar hand-edit.
    # 16-23 UTC = 9 AM–4 PM PDT; adding 17-23,0 UTC covers 9 AM–4 PM PST too.
    # Off-window fires are harmless — sheet_worker upserts idempotently (on_conflict).
    - cron: "0 16-23,0 * * *"   # 9 AM–4 PM Pacific in both PDT and PST
  workflow_dispatch:          # adds a manual "Run workflow" button for testing
    inputs:
      dry:
        description: "Dry run (parse only, write nothing)"
        required: false
        default: "no"

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Pull the sheet into sheet_log
        env:
          TZ: America/Los_Angeles   # #aug12 — sheet_worker uses naive date.today(); pin it to Pacific like dispatchbot.yml
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ "${{ github.event.inputs.dry }}" = "yes" ]; then
            python3 bot/sheet_worker.py --dry
          else
            python3 bot/sheet_worker.py
          fi
