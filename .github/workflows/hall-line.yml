# .github/workflows/hall-line.yml
# Calls the hall's recorded dispatch line after each board ends, transcribes it,
# and posts "left off at ___" to the Order's board wire.
#
# #jul30b — DENSE NET + PRE-CALL SKIP. GitHub's free-tier cron scheduler DROPS
# scheduled runs under load (it skipped all five night sweeps on Jul 30 while
# the recording sat there saying S5042). Two-part answer:
#   1. Many more cron entries — the odds of GitHub dropping ALL of them are low.
#   2. leftoff.js now checks board_wire BEFORE dialing: once the end card is on
#      the wire (a hand sealed it, or an earlier sweep read it), every later
#      sweep exits in ~2 seconds without a Twilio call. Dense schedule, single
#      call on a normal day. Worst case (unreadable recording all night) is
#      ~11 calls ≈ fifty cents.
# Odd minutes on purpose: GitHub's cron queue is most crowded at :00/:15/:30/:45.
#
# GitHub cron is UTC and ignores daylight saving, so runs are scheduled at both
# the PDT and PST offsets — off-window firings exit in under a second, and
# same-window overlaps just act as extra retries.
name: hall-line-leftoff

on:
  schedule:
    # ── morning sweep (day board ends 09:30; worker gate 09:35–13:00 LA) ──
    - cron: '37 16 * * *'   # 09:37 PDT — first read
    - cron: '52 16 * * *'   # 09:52 PDT
    - cron: '9 17 * * *'    # 10:09 PDT            (09:09 PST → gate closed, exits)
    - cron: '26 17 * * *'   # 10:26 PDT
    - cron: '43 17 * * *'   # 10:43 PDT · 09:43 PST — PST first read
    - cron: '58 17 * * *'   # 10:58 PDT · 09:58 PST
    - cron: '17 18 * * *'   # 11:17 PDT · 10:17 PST
    - cron: '41 18 * * *'   # 11:41 PDT · 10:41 PST
    - cron: '11 19 * * *'   # 12:11 PDT · 11:11 PST
    - cron: '43 19 * * *'   # 12:43 PDT · 11:43 PST — late net
    # ── night sweep (night board ends 19:00; worker gate 19:05–23:30 LA) ──
    - cron: '8 2 * * *'     # 19:08 PDT — first read, right after the 7:00 end
    - cron: '19 2 * * *'    # 19:19 PDT
    - cron: '31 2 * * *'    # 19:31 PDT
    - cron: '44 2 * * *'    # 19:44 PDT
    - cron: '57 2 * * *'    # 19:57 PDT
    - cron: '13 3 * * *'    # 20:13 PDT · 19:13 PST — PST first read
    - cron: '29 3 * * *'    # 20:29 PDT · 19:29 PST
    - cron: '46 3 * * *'    # 20:46 PDT · 19:46 PST
    - cron: '4 4 * * *'     # 21:04 PDT · 20:04 PST
    - cron: '33 4 * * *'    # 21:33 PDT · 20:33 PST
    - cron: '2 5 * * *'     # 22:02 PDT · 21:02 PST — final net
    # ── #oct30(forecast) — pre-flex FORECAST reads: the hall's "we have N jobs" line keeps
    #    changing through the day; the Wire's call needs the LAST number before dispatch starts.
    #    Worker runs in --forecast mode: dials inside 05:00–06:28 / 15:00–16:28 LA only, logs the
    #    count, never touches board_wire. Capped at FORECAST_MAX_CALLS (2) paid reads per window.
    #    Off-window firings exit in under a second. ~4 extra calls a day ≈ twenty cents.
    - cron: '48 12 * * *'   # 05:48 PDT — day board, first forecast read
    - cron: '18 13 * * *'   # 06:18 PDT · 05:18 PST — day board, last read before 6:30 / PST first read
    - cron: '48 13 * * *'   # 06:48 PDT (gate closed, exits) · 05:48 PST
    - cron: '19 14 * * *'   # 06:19 PST — day board, last read before 6:30
    - cron: '47 22 * * *'   # 15:47 PDT — night board, first forecast read
    - cron: '19 23 * * *'   # 16:19 PDT · 15:19 PST — night board, last read before 4:30 / PST first read
    - cron: '47 23 * * *'   # 16:47 PDT (gate closed, exits) · 15:47 PST
    - cron: '19 0 * * *'    # 16:19 PST — night board, last read before 4:30
  workflow_dispatch:
    inputs:
      early:
        description: 'Dispatch ended early — run now (all cost protections stay armed)'
        type: boolean
        default: false
      force:
        description: 'Override EVERYTHING incl. the cost skips — always dials'
        type: boolean
        default: false
      forecast:
        description: 'Pre-flex forecast read — log "we have N jobs" for the board about to start'
        type: boolean
        default: false
      dry_run:
        description: 'Do everything except write to Supabase'
        type: boolean
        default: false
      transcript:
        description: 'Skip the call — parse this text instead (testing)'
        required: false

concurrency:
  group: hall-line
  cancel-in-progress: false

jobs:
  leftoff:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Call the hall line and post where it left off
        env:
          TWILIO_SID:           ${{ secrets.TWILIO_SID }}
          TWILIO_TOKEN:         ${{ secrets.TWILIO_TOKEN }}
          TWILIO_FROM:          ${{ secrets.TWILIO_FROM }}
          DISPATCH_NUMBER:      ${{ secrets.DISPATCH_NUMBER }}
          DISPATCH_DTMF:        ${{ secrets.DISPATCH_DTMF }}
          CALL_SECONDS:         ${{ vars.CALL_SECONDS || '120' }}
          OPENAI_API_KEY:       ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SLOT_KEYWORDS:        ${{ vars.SLOT_KEYWORDS }}
          MIN_CONF:             ${{ vars.MIN_CONF || '0.75' }}
          MAX_CALLS_PER_WINDOW: ${{ vars.MAX_CALLS_PER_WINDOW || '4' }}
          FORECAST_MAX_CALLS:   ${{ vars.FORECAST_MAX_CALLS || '2' }}
        run: |
          ARGS=""
          # #oct30(forecast) — the pre-flex schedule entries and the manual switch run the forecast read.
          # Any scheduled firing inside the pre-flex windows is a forecast read; the worker's own gate
          # decides, so the end-card sweeps are unaffected (they never fire in those windows).
          LA_MIN=$(TZ=America/Los_Angeles date +%-H)
          LA_MIN=$(( LA_MIN * 60 + $(TZ=America/Los_Angeles date +%-M) ))
          if [ "${{ inputs.forecast }}" = "true" ] || { [ "${{ github.event_name }}" = "schedule" ] && { { [ $LA_MIN -ge 300 ] && [ $LA_MIN -le 388 ]; } || { [ $LA_MIN -ge 900 ] && [ $LA_MIN -le 988 ]; }; }; }; then ARGS="$ARGS --forecast"; fi
          [ "${{ inputs.early }}" = "true" ] && ARGS="$ARGS --early"
          [ "${{ inputs.force }}" = "true" ] && ARGS="$ARGS --force"
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          if [ -n "${{ inputs.transcript }}" ]; then
            node hall-line-worker/leftoff.js $ARGS --transcript "${{ inputs.transcript }}"
          else
            node hall-line-worker/leftoff.js $ARGS
          fi

      # ═══ #lookout — the board's movement reaches closed phones ═══
      # Runs after every sweep; push_sent dedupes so each board announces once.
      # Needs VAPID_PUBLIC (repo variable) + VAPID_PRIVATE (secret) — generate
      # once with `npx web-push generate-vapid-keys`. Missing keys = stands down.
      - name: The Lookout — push the board to subscribed phones
        if: ${{ always() }}
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VAPID_PUBLIC:         ${{ vars.VAPID_PUBLIC || 'BOIf-N1g5af_QuVRTc9AbScS5YWjUMAX8wSFjfbC4Y6KPVJvLGxzvWrgPSBb38yYvCAuKCJqAGWisb8d-vZpbss' }}
          VAPID_PRIVATE:        ${{ secrets.VAPID_PRIVATE }}
          VAPID_SUBJECT:        ${{ vars.VAPID_SUBJECT || 'mailto:keymaster@theshadowhook.com' }}
          PUSH_AHEAD:           ${{ vars.PUSH_AHEAD || '3' }}
        run: |
          npm install --no-save --silent web-push
          node hall-line-worker/push-board.js
