# Builds the Shadow Hook iPhone app on GitHub's Mac and sends it to TestFlight.
# Run it by hand: GitHub → Actions → "iOS build to TestFlight" → Run workflow.
#
# Needs four repository secrets (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID   your 10-character Apple team ID
#   ASC_KEY_ID      App Store Connect API key ID
#   ASC_ISSUER_ID   App Store Connect API issuer ID
#   ASC_KEY_P8      the full text of the AuthKey_XXXX.p8 file
#
# Signing: each run makes its own Apple Distribution certificate and App Store profile through the API
# (ios-app/scripts/signing.mjs), signs the archive with them (so push notifications are included), and revokes
# them at the end. Builds already sent to Apple keep working; Apple re-signs them.
# Widgets: ios-app/widgets/ShadowHookWidgets.swift is added to the project as an extension by scripts/add_widgets.rb.
name: iOS build to TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios-app
    env:
      BUNDLE_ID: com.theshadowhook.app
      APP_VERSION: "1.0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Create the iOS project
        run: |
          npx cap add ios
          npx cap sync ios

      - name: App icon
        run: |
          ICONSET=ios/App/App/Assets.xcassets/AppIcon.appiconset
          rm -f "$ICONSET"/*.png
          cp resources/AppIcon-1024.png "$ICONSET/AppIcon-1024.png"
          cat > "$ICONSET/Contents.json" <<'JSON'
          {
            "images": [
              { "filename": "AppIcon-1024.png", "idiom": "universal", "platform": "ios", "size": "1024x1024" }
            ],
            "info": { "author": "xcode", "version": 1 }
          }
          JSON

      - name: Permissions wording and settings
        run: |
          PLIST=ios/App/App/Info.plist
          pb() { /usr/libexec/PlistBuddy -c "$1" "$PLIST" 2>/dev/null || true; }
          set_str() { pb "Delete :$1"; /usr/libexec/PlistBuddy -c "Add :$1 string $2" "$PLIST"; }
          set_str NSCameraUsageDescription "Shadow Hook uses the camera to scan your job dockets and to take photos you choose to post."
          set_str NSPhotoLibraryUsageDescription "Shadow Hook lets you pick a photo from your library to attach to a docket or a post."
          set_str NSPhotoLibraryAddUsageDescription "Shadow Hook can save a copy of your scanned docket to your photos."
          set_str NSLocationWhenInUseUsageDescription "Shadow Hook uses your location to tag a post with the terminal you are working at, and to add where you are standing to a gate message when you ask it to."
          set_str NSFaceIDUsageDescription "Shadow Hook uses Face ID to lock the app so only you can open your dockets and messages."
          pb "Delete :ITSAppUsesNonExemptEncryption"
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print" "$PLIST" | head -60

      - name: Push permission
        run: |
          cat > ios/App/App/App.entitlements <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>aps-environment</key><string>production</string>
          </dict></plist>
          XML

      - name: App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          KEY="$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          # Windows copy/paste adds \r and stray spaces; rebuild a clean PEM either way.
          BODY=$(printf '%s' "$ASC_KEY_P8" | tr -d '\r' | sed -e '/-----BEGIN/d' -e '/-----END/d' | tr -d ' \n\t')
          {
            echo "-----BEGIN PRIVATE KEY-----"
            printf '%s' "$BODY" | fold -w 64
            echo
            echo "-----END PRIVATE KEY-----"
          } > "$KEY"
          if openssl pkey -in "$KEY" -noout 2>/dev/null; then echo "key file: valid"; else echo "::error::ASC_KEY_P8 is not a valid private key. Re-paste the whole .p8 file into that secret."; exit 1; fi

      - name: Signing certificate and profile
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          export ASC_KEY_FILE="$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          SIGN_DIR="$RUNNER_TEMP/signing"; echo "SIGN_DIR=$SIGN_DIR" >> "$GITHUB_ENV"
          export WIDGET_BUNDLE_ID="${BUNDLE_ID}.widgets"
          node scripts/signing.mjs setup "$SIGN_DIR"
          # a private keychain on this Mac for the certificate
          KC="$RUNNER_TEMP/signing.keychain-db"; KCPW="$(openssl rand -hex 16)"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          curl -fsSL -o "$SIGN_DIR/AppleWWDRCAG3.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security import "$SIGN_DIR/AppleWWDRCAG3.cer" -k "$KC" -T /usr/bin/codesign || true
          P12PW="$(openssl rand -hex 16)"
          openssl x509 -inform DER -in "$SIGN_DIR/dist.cer" -out "$SIGN_DIR/dist.pem"
          /usr/bin/openssl pkcs12 -export -inkey "$SIGN_DIR/dist.key" -in "$SIGN_DIR/dist.pem" -out "$SIGN_DIR/dist.p12" -passout pass:"$P12PW"
          security import "$SIGN_DIR/dist.p12" -k "$KC" -P "$P12PW" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$SIGN_DIR/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$(cat "$SIGN_DIR/profile-uuid.txt").mobileprovision"
          cp "$SIGN_DIR/widget-profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$(cat "$SIGN_DIR/widget-profile-uuid.txt").mobileprovision"
          echo "KC=$KC" >> "$GITHUB_ENV"

      - name: Point the app at the certificate and profile
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          PBX=ios/App/App.xcodeproj/project.pbxproj
          PROFILE="$(cat "$SIGN_DIR/profile-name.txt")"
          sed -i '' -e '/CODE_SIGN_STYLE = /d' -e '/CODE_SIGN_IDENTITY/d' -e '/PROVISIONING_PROFILE/d' -e '/DEVELOPMENT_TEAM = /d' -e '/CODE_SIGN_ENTITLEMENTS = /d' "$PBX"
          sed -i '' "s#INFOPLIST_FILE = App/Info.plist;#INFOPLIST_FILE = App/Info.plist; CODE_SIGN_ENTITLEMENTS = App/App.entitlements; CODE_SIGN_STYLE = Manual; DEVELOPMENT_TEAM = $TEAM_ID; CODE_SIGN_IDENTITY = \"Apple Distribution\"; \"CODE_SIGN_IDENTITY[sdk=iphoneos*]\" = \"Apple Distribution\"; PROVISIONING_PROFILE_SPECIFIER = \"$PROFILE\";#" "$PBX"
          echo "app configurations pointed at the profile: $(grep -c "PROVISIONING_PROFILE_SPECIFIER = \"$PROFILE\"" "$PBX")"

      - name: Add the widgets
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          gem install xcodeproj --no-document >/dev/null 2>&1 || gem install xcodeproj --no-document --user-install
          export WIDGET_BUNDLE_ID="${BUNDLE_ID}.widgets" WIDGET_PROFILE="$(cat "$SIGN_DIR/widget-profile-name.txt")"
          ruby scripts/add_widgets.rb

      - name: Build the archive
        run: |
          if [ -d ios/App/App.xcworkspace ]; then TARGET="-workspace ios/App/App.xcworkspace"; else TARGET="-project ios/App/App.xcodeproj"; fi
          xcodebuild $TARGET -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KC" \
            MARKETING_VERSION="$APP_VERSION" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive
          APP="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
          codesign -d --entitlements - "$APP" 2>&1 | tail -20
          if codesign -d --entitlements - "$APP" 2>&1 | grep -q aps-environment; then echo "PUSH PERMISSION: IN THE APP"; else echo "::error::push permission missing from the signed app"; exit 1; fi

      - name: Send to TestFlight
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          PROFILE="$(cat "$SIGN_DIR/profile-name.txt")"
          WIDGET_PROFILE="$(cat "$SIGN_DIR/widget-profile-name.txt")"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict><key>${BUNDLE_ID}</key><string>${PROFILE}</string><key>${BUNDLE_ID}.widgets</key><string>${WIDGET_PROFILE}</string></dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Revoke this run's certificate and profile
        if: always()
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          export ASC_KEY_FILE="$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          [ -f "$ASC_KEY_FILE" ] && [ -n "${SIGN_DIR:-}" ] && node scripts/signing.mjs cleanup "$SIGN_DIR" || true
          [ -n "${KC:-}" ] && security delete-keychain "$KC" || true

      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys" "$RUNNER_TEMP/signing"
