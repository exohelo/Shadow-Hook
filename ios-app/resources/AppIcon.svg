<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#232838"/><stop offset=".6" stop-color="#11131c"/><stop offset="1" stop-color="#06070b"/>
    </radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f6fa"/><stop offset=".35" stop-color="#c3c9d4"/><stop offset=".7" stop-color="#7d8596"/><stop offset="1" stop-color="#4a505e"/>
    </linearGradient>
    <linearGradient id="steelH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6c7383"/><stop offset=".45" stop-color="#eef1f6"/><stop offset=".55" stop-color="#dde2ea"/><stop offset="1" stop-color="#5d6474"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6eaf1"/><stop offset=".5" stop-color="#8a92a3"/><stop offset="1" stop-color="#d3d8e1"/>
    </linearGradient>
    <radialGradient id="face" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#2b3040"/><stop offset="1" stop-color="#151821"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".65"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- badge -->
  <g filter="url(#sh)">
    <circle cx="512" cy="548" r="372" fill="url(#face)"/>
    <circle cx="512" cy="548" r="372" fill="none" stroke="url(#ring)" stroke-width="30"/>
    <circle cx="512" cy="548" r="326" fill="none" stroke="#8a92a3" stroke-opacity=".55" stroke-width="6"/>
    <!-- rivets -->
    <g fill="url(#steel)">
      <circle cx="512" cy="904" r="12"/><circle cx="260" cy="800" r="11"/><circle cx="764" cy="800" r="11"/>
      <circle cx="156" cy="548" r="11"/><circle cx="868" cy="548" r="11"/>
    </g>
  </g>

  <!-- crossed longshore hand-hooks (behind) -->
  <g filter="url(#sh)" stroke-linecap="round" fill="none">
    <!-- left hook: handle low-left, point up-right -->
    <line x1="262" y1="820" x2="700" y2="300" stroke="url(#steelH)" stroke-width="34"/>
    <path d="M700 300 C 742 250, 790 262, 790 310 C 790 340, 770 356, 748 352" stroke="url(#steel)" stroke-width="30"/>
    <rect x="214" y="800" width="104" height="34" rx="14" transform="rotate(-50 262 817)" fill="url(#steelH)" stroke="none"/>
    <!-- right hook: handle low-right, point up-left -->
    <line x1="762" y1="820" x2="324" y2="300" stroke="url(#steelH)" stroke-width="34"/>
    <path d="M324 300 C 282 250, 234 262, 234 310 C 234 340, 254 356, 276 352" stroke="url(#steel)" stroke-width="30"/>
    <rect x="706" y="800" width="104" height="34" rx="14" transform="rotate(50 762 817)" fill="url(#steelH)" stroke="none"/>
  </g>

  <!-- chain from the top -->
  <g fill="none" stroke="url(#steel)" stroke-width="20" filter="url(#sh)">
    <rect x="490" y="-20" width="44" height="86" rx="22"/>
    <rect x="500" y="50" width="24" height="86" rx="12" stroke-width="18"/>
    <rect x="490" y="120" width="44" height="86" rx="22"/>
    <rect x="500" y="190" width="24" height="70" rx="12" stroke-width="18"/>
  </g>


  <!-- the seal's banner: THE SHADOW HOOK -->
  <g filter="url(#sh)">
    <path d="M150 196 L232 196 L232 300 L150 300 L186 248 Z" fill="#3b4150" stroke="url(#ring)" stroke-width="8" stroke-linejoin="round"/>
    <path d="M874 196 L792 196 L792 300 L874 300 L838 248 Z" fill="#3b4150" stroke="url(#ring)" stroke-width="8" stroke-linejoin="round"/>
    <path d="M206 176 Q512 136 818 176 L818 288 Q512 248 206 288 Z" fill="#20242f" stroke="url(#ring)" stroke-width="12" stroke-linejoin="round"/>
    <text x="512" y="262" text-anchor="middle" font-family="Anton" font-size="94" letter-spacing="3" fill="url(#steel)" stroke="#0b0d12" stroke-width="2">THE SHADOW HOOK</text>
  </g>
  <!-- the anchor-hook (front, center) -->
  <g filter="url(#sh)">
    <circle cx="512" cy="318" r="30" fill="none" stroke="url(#steel)" stroke-width="22"/>
    <rect x="490" y="342" width="44" height="398" rx="16" fill="url(#steelH)"/>
    <rect x="410" y="400" width="204" height="34" rx="14" fill="url(#steelH)"/>
    <!-- flukes -->
    <path d="M512 770 C 430 770, 352 726, 330 640" fill="none" stroke="url(#steel)" stroke-width="40" stroke-linecap="round"/>
    <path d="M512 770 C 594 770, 672 726, 694 640" fill="none" stroke="url(#steel)" stroke-width="40" stroke-linecap="round"/>
    <path d="M296 668 L330 590 L370 664 Z" fill="url(#steel)"/>
    <path d="M728 668 L694 590 L654 664 Z" fill="url(#steel)"/>
    <path d="M482 740 L512 812 L542 740 Z" fill="url(#steel)"/>
  </g>

  <!-- waves under the anchor -->
  <g fill="none" stroke="#7d8596" stroke-opacity=".7" stroke-width="10" stroke-linecap="round">
    <path d="M300 846 q 35 -24 70 0 t 70 0 t 70 0 t 70 0 t 70 0 t 70 0"/>
  </g>
</svg>
