<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">

<!-- #flip(nov24) — THE FLIP: who goes on first. A member starts a flip, puts in everyone standing there (members by handle,
     anybody else by name), sets how many spots there are (1 early go, 3 early goes …) and taps FLIP IT. The server draws
     the order (flip_draw, gen_random_uuid), so no phone decides it; everyone in it watches the same result land.
     Members get a 🔔 when they're put in and when it lands. Others can join with the 4-letter code. -->
<style>
:root{--bg:#0b0a14;--card:#161327;--card2:#1e1a35;--line:#ffffff1f;--tx:#f4f1ff;--mut:#a9a2cf;--gold:#fbbf24;--vio:#8b5cf6;--red:#ef4444;--grn:#22c55e}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:"Barlow Condensed",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 28px)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:520px;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.top a,.top button{color:var(--mut);text-decoration:none;font-weight:700;font-size:15px;background:none;border:0;padding:0}
h1{font:400 38px/1 Anton,sans-serif;letter-spacing:2px;margin:6px 0 2px;color:var(--gold);text-align:center}
.sub{text-align:center;color:var(--mut);font-size:16px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.lbl{font:400 14px/1 Anton,sans-serif;letter-spacing:1.5px;color:var(--mut);margin:0 0 8px}
input[type=text],textarea{width:100%;background:var(--card2);border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-size:18px;outline:none}
input[type=text]:focus,textarea:focus{border-color:var(--vio)}
textarea{min-height:120px;resize:vertical;line-height:1.35}
.hint{color:var(--mut);font-size:14px;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chips button{padding:7px 12px;border-radius:999px;border:2px solid var(--line);background:var(--card2);font-weight:700;font-size:15px}
.chips button.on{border-color:var(--gold);color:var(--gold)}
.step{display:flex;align-items:center;gap:12px}
.step button{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--card2);font:400 24px/1 Anton,sans-serif}
.step b{font:400 34px/1 Anton,sans-serif;color:var(--gold);min-width:40px;text-align:center}
.step span{color:var(--mut);font-size:16px}
.big{display:block;width:100%;padding:15px;border-radius:14px;border:0;background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#1a1205;font:400 22px/1 Anton,sans-serif;letter-spacing:2px;box-shadow:0 6px 20px #fbbf2440}
.big:disabled{opacity:.5}
.ghost{display:block;width:100%;padding:12px;border-radius:14px;border:2px solid var(--line);background:none;font:400 16px/1 Anton,sans-serif;letter-spacing:1.5px;color:var(--mut);margin-top:8px}
.row{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);margin-bottom:8px}
.row .rt{flex:1;min-width:0}.row .rt b{display:block;font-size:19px}.row .rt span{color:var(--mut);font-size:15px}
.tag{font:400 13px/1 Anton,sans-serif;letter-spacing:1px;padding:5px 8px;border-radius:8px;background:var(--card2);color:var(--mut)}
.tag.open{color:var(--gold)}.tag.won{background:#fbbf24;color:#1a1205}
.join{display:flex;gap:8px}.join input{flex:1;text-transform:uppercase;letter-spacing:4px;text-align:center}
.join button{padding:0 16px;border-radius:12px;border:0;background:var(--vio);font:400 16px/1 Anton,sans-serif;letter-spacing:1px}
.head{text-align:center;margin:4px 0 12px}
.head .t{font:400 30px/1.05 Anton,sans-serif;letter-spacing:1px}
.head .m{color:var(--mut);font-size:16px;margin-top:4px}
.code{display:inline-block;margin-top:8px;padding:6px 12px;border-radius:10px;border:2px dashed #fbbf2466;color:var(--gold);font:400 20px/1 Anton,sans-serif;letter-spacing:5px}
.names{display:flex;flex-direction:column;gap:6px}
.nm{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--card2);border:2px solid transparent;font-size:19px;font-weight:700;transition:transform .15s,background .15s,border-color .15s}
.nm .pos{font:400 16px/1 Anton,sans-serif;color:var(--mut);min-width:26px}
.nm .who{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm .mb{font-size:12px;color:var(--vio);font-weight:700;letter-spacing:.5px}
.nm .x{background:none;border:0;color:var(--mut);font-size:20px;padding:0 4px}
.nm.me{border-color:#8b5cf666}
.nm.hot{background:#3b2a07;border-color:var(--gold);transform:scale(1.02)}
.nm.win{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#1a1205;border-color:#fde68a}
.nm.win .pos,.nm.win .mb{color:#1a1205}
.nm.out{opacity:.55}
.addrow{display:flex;gap:8px;margin-top:10px}.addrow input{flex:1}
.addrow button{padding:0 16px;border-radius:12px;border:2px solid var(--line);background:var(--card2);font:400 16px/1 Anton,sans-serif;letter-spacing:1px}
.banner{text-align:center;font:400 26px/1.1 Anton,sans-serif;letter-spacing:1px;margin:6px 0 12px;color:var(--gold)}
.banner.lost{color:var(--mut)}
.coin{width:84px;height:84px;margin:0 auto 10px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fde68a,#f59e0b 60%,#92400e);box-shadow:0 0 30px #fbbf2455;display:flex;align-items:center;justify-content:center;font:400 34px/1 Anton,sans-serif;color:#1a1205}
.coin.spin{animation:spin .5s linear infinite}
@keyframes spin{0%{transform:rotateY(0)}100%{transform:rotateY(360deg)}}
.empty{color:var(--mut);text-align:center;padding:18px 8px;font-size:16px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);background:#000c;border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-weight:700;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9;max-width:90vw;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="/" id="back">← The Hook</a><span style="flex:1"></span><span id="who" style="color:var(--mut);font-weight:700"></span></div>
  <div id="view"></div>
</div>
<div id="toast"></div>
<script>
var SB_URL='https://ehykqebzkbelwtkgjbml.supabase.co', SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVoeWtxZWJ6a2JlbHd0a2dqYm1sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzMDMwNTMsImV4cCI6MjA5OTg3OTA1M30.RgdTFy1HNE36lN3bM6ovjkmAJsTEps0GmgRuI6h6IpI';
var sb=null, ME=null, F=null, pollT=null, busy=false, seenDone={}, NEW={title:'Early go',spots:1,names:''};
var TITLES=['Early go','Go on first','Lunch relief','Short shift','Last spot'];
function $(id){ return document.getElementById(id); }
function esc(t){ return String(t==null?'':t).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
var toastT=0; function toast(t){ var el=$('toast'); el.textContent=t; el.style.opacity=1; clearTimeout(toastT); toastT=setTimeout(function(){ el.style.opacity=0; },2800); }
function rpc(fn,args){ if(!sb) return Promise.reject(new Error('offline')); return sb.rpc(fn,args||{}).then(function(r){ if(r.error) throw new Error(r.error.message||'something went wrong'); return r.data; }); }
function ago(t){ var s=(Date.now()-new Date(t).getTime())/1000; if(s<60) return 'just now'; if(s<3600) return Math.floor(s/60)+'m ago'; if(s<86400) return Math.floor(s/3600)+'h ago'; return Math.floor(s/86400)+'d ago'; }
function plural(n,w){ return n+' '+w+(n===1?'':'s'); }
window.SHK_SHELL_DEEP=function(){ return !!F; };
window.SHK_SHELL_BACK=function(){ if(F){ lobby(); return true; } return false; };
function setURL(id){ try{ history.replaceState(null,'',id?('?f='+id):location.pathname); }catch(e){} }

/* ───────── boot ───────── */
(function(){
  var s=document.createElement('script'); s.src='/supabase-js-2.112.2.js';
  s.onload=function(){
    try{ sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}}); }catch(e){ sb=null; }
    if(!sb) return signedOut();
    sb.auth.getSession().then(function(r){ var se=r&&r.data&&r.data.session; if(!se) return signedOut();
      var q=new URLSearchParams(location.search), fid=q.get('f'), code=q.get('code');
      if(code) return rpc('flip_join',{p_code:code}).then(showFlip).catch(function(e){ toast(e.message); lobby(); });
      if(fid&&/^\d+$/.test(fid)) return rpc('flip_state',{p_id:+fid}).then(showFlip).catch(function(e){ toast(e.message); lobby(); });
      lobby();
    }).catch(signedOut);
  };
  s.onerror=signedOut; document.head.appendChild(s);
  document.addEventListener('visibilitychange',function(){ if(!document.hidden) refresh(); });
})();
function signedOut(){ $('view').innerHTML='<h1>THE FLIP</h1><div class="row"><div class="rt"><b>Sign in first</b><span>Open <a href="/" style="color:var(--gold)">The Shadow Hook</a>, sign in, then come back.</span></div></div>'; }
function poll(on){ clearInterval(pollT); if(on) pollT=setInterval(function(){ if(!document.hidden) refresh(); },2500); }
function refresh(){
  if(busy) return;
  if(F){ rpc('flip_state',{p_id:F.id}).then(function(f){ if(JSON.stringify(f)!==JSON.stringify(F)) showFlip(f); }).catch(function(){}); }
}

/* ───────── lobby: start one, join one, my flips ───────── */
function lobby(){
  F=null; poll(false); setURL(null); $('back').textContent='← The Hook'; $('back').href='/'; $('back').onclick=null;
  rpc('flip_lobby').then(function(x){ ME=x.me; $('who').textContent=ME||''; drawLobby(x.flips||[]); }).catch(function(e){ $('view').innerHTML='<h1>THE FLIP</h1><div class="empty">'+esc(e.message)+'</div>'; });
}
function drawLobby(list){
  var h='<h1>THE FLIP</h1><div class="sub">Who goes on first? Put everyone in. The server picks — fair, random, one tap.</div>';
  h+='<div class="card"><div class="lbl">WHAT\'S IT FOR</div><div class="chips" id="tChips">'+TITLES.map(function(t){ return '<button data-t="'+esc(t)+'"'+(t===NEW.title?' class="on"':'')+'>'+esc(t)+'</button>'; }).join('')+'</div>'+
     '<input type="text" id="nTitle" maxlength="40" value="'+esc(NEW.title)+'">'+
     '<div class="lbl" style="margin-top:14px">HOW MANY SPOTS</div><div class="step"><button id="sMinus">−</button><b id="sN">'+NEW.spots+'</b><button id="sPlus">+</button><span id="sTx">'+(NEW.spots===1?'one person gets it':NEW.spots+' people get it')+'</span></div>'+
     '<div class="lbl" style="margin-top:14px">WHO\'S IN</div><textarea id="nNames" placeholder="One per line or split by commas&#10;Big Mike&#10;Tony&#10;RED_KIDD_50">'+esc(NEW.names)+'</textarea>'+
     '<div class="hint">You\'re in automatically. A member\'s handle gets them a 🔔 so they can watch it land; anybody else, just type their name.</div>'+
     '<button class="big" id="nGo" style="margin-top:14px">START THE FLIP</button></div>';
  h+='<div class="card"><div class="lbl">GOT A CODE?</div><div class="join"><input type="text" id="jCode" maxlength="4" placeholder="CODE" autocapitalize="characters"><button id="jGo">JOIN</button></div></div>';
  h+='<div class="lbl" style="margin:16px 0 8px">MY FLIPS</div>';
  if(!list.length) h+='<div class="empty">No flips yet. Start one above when there\'s a spot to settle.</div>';
  list.forEach(function(f){
    var n=f.players.length, mine=f.status==='done'&&wonBy(f);
    var tg=f.status==='open'?'<span class="tag open">OPEN</span>':f.status==='cancelled'?'<span class="tag">CANCELLED</span>':mine?'<span class="tag won">🏆 YOU</span>':'<span class="tag">LANDED</span>';
    h+='<div class="row" data-f="'+f.id+'" role="button"><div class="rt"><b>'+esc(f.title)+'</b><span>'+plural(f.spots,'spot')+' · '+plural(n,'name')+' · by '+esc(f.host)+' · '+ago(f.drawn_at||f.created_at)+'</span></div>'+tg+'</div>';
  });
  $('view').innerHTML=h;
  $('tChips').onclick=function(e){ var b=e.target.closest('[data-t]'); if(!b) return; NEW.title=b.dataset.t; $('nTitle').value=NEW.title; [].forEach.call(this.children,function(c){ c.classList.toggle('on',c===b); }); };
  $('nTitle').oninput=function(){ NEW.title=this.value; };
  $('nNames').oninput=function(){ NEW.names=this.value; };
  function spots(d){ NEW.spots=Math.max(1,Math.min(11,NEW.spots+d)); $('sN').textContent=NEW.spots; $('sTx').textContent=NEW.spots===1?'one person gets it':NEW.spots+' people get it'; }
  $('sMinus').onclick=function(){ spots(-1); }; $('sPlus').onclick=function(){ spots(1); };
  $('nGo').onclick=function(){ var b=this; b.disabled=true;
    rpc('flip_new',{p_title:NEW.title,p_spots:NEW.spots,p_names:NEW.names}).then(function(f){ NEW.names=''; showFlip(f); }).catch(function(e){ toast(e.message); b.disabled=false; }); };
  $('jGo').onclick=function(){ var c=$('jCode').value.trim(); if(c.length<4) return toast('The code is 4 letters');
    rpc('flip_join',{p_code:c}).then(showFlip).catch(function(e){ toast(e.message); }); };
  [].forEach.call(document.querySelectorAll('[data-f]'),function(r){ r.onclick=function(){ rpc('flip_state',{p_id:+r.dataset.f}).then(showFlip).catch(function(e){ toast(e.message); }); }; });
}
function wonBy(f){ if(!f.draw) return false; for(var i=0;i<f.spots&&i<f.draw.length;i++){ var p=f.players.filter(function(x){ return x.id===f.draw[i].id; })[0]; if(p&&p.me) return true; } return false; }

/* ───────── one flip ───────── */
function showFlip(f){
  var was=F; F=f; setURL(f.id);
  $('back').textContent='← My flips'; $('back').href='#'; $('back').onclick=function(e){ e.preventDefault(); lobby(); };
  if(f.status==='done'){
    poll(false);
    var fresh=(was&&was.id===f.id&&was.status==='open') || (!seenDone[f.id] && Date.now()-new Date(f.drawn_at).getTime()<45000);
    seenDone[f.id]=1;
    return fresh?reveal(f):drawDone(f);
  }
  poll(f.status==='open');
  drawOpen(f);
}
function header(f){
  return '<div class="head"><div class="t">'+esc(f.title)+'</div><div class="m">'+plural(f.spots,'spot')+' · '+plural(f.players.length,'name')+' · started by '+esc(f.host)+'</div>'+
    (f.status==='open'?'<div class="code" id="code" role="button" title="Share">'+esc(f.code)+'</div><div class="hint" style="text-align:center">Others join with this code, or tap it to share</div>':'')+'</div>';
}
function drawOpen(f){
  var n=f.players.length, h='<div class="coin">'+f.spots+'</div>'+header(f);
  if(f.status==='cancelled') h+='<div class="banner lost">CANCELLED</div>';
  h+='<div class="card"><div class="lbl">WHO\'S IN</div><div class="names">';
  f.players.forEach(function(p){
    var canX=f.status==='open'&&(f.is_host?!(p.me):p.me);
    h+='<div class="nm'+(p.me?' me':'')+'"><span class="who">'+esc(p.n)+'</span>'+(p.m?'<span class="mb">MEMBER</span>':'')+(canX?'<button class="x" data-x="'+p.id+'" aria-label="Take off">✕</button>':'')+'</div>';
  });
  h+='</div>';
  if(f.status==='open'&&f.is_host) h+='<div class="addrow"><input type="text" id="aName" placeholder="Add a name or handle" maxlength="60"><button id="aGo">ADD</button></div>';
  h+='</div>';
  if(f.status==='open'){
    if(f.is_host){
      var ok=n>=2&&f.spots<n;
      h+='<button class="big" id="fGo"'+(ok?'':' disabled')+'>🪙 FLIP IT</button>';
      h+='<div class="hint" style="text-align:center">'+(n<2?'Add at least one more name.':f.spots>=n?plural(f.spots,'spot')+' for '+plural(n,'name')+' — everybody goes, no flip needed.':plural(f.spots,'winner')+' out of '+n+'. Everyone in it sees the same result.')+'</div>';
      h+='<button class="ghost" id="fCancel">CANCEL THIS FLIP</button>';
    } else h+='<div class="empty">Waiting on '+esc(f.host)+' to flip it… this page updates by itself.</div>';
  }
  $('view').innerHTML=h;
  var cd=$('code'); if(cd) cd.onclick=function(){ share(f); };
  [].forEach.call(document.querySelectorAll('[data-x]'),function(b){ b.onclick=function(){ b.disabled=true; rpc('flip_remove',{p_id:f.id,p_player:+b.dataset.x}).then(function(x){ if(!x.in&&!x.is_host) return lobby(); showFlip(x); }).catch(function(e){ toast(e.message); b.disabled=false; }); }; });
  if($('aGo')){ var add=function(){ var v=$('aName').value.trim(); if(!v) return; $('aGo').disabled=true; rpc('flip_add',{p_id:f.id,p_names:v}).then(showFlip).catch(function(e){ toast(e.message); $('aGo').disabled=false; }); };
    $('aGo').onclick=add; $('aName').onkeydown=function(e){ if(e.key==='Enter') add(); }; }
  if($('fGo')) $('fGo').onclick=function(){ var b=this; b.disabled=true; busy=true; rpc('flip_draw',{p_id:f.id}).then(function(x){ busy=false; showFlip(x); }).catch(function(e){ busy=false; toast(e.message); b.disabled=false; }); };
  if($('fCancel')) $('fCancel').onclick=function(){ var b=this; if(!b.dataset.sure){ b.dataset.sure=1; b.textContent='TAP AGAIN TO CANCEL'; return; } rpc('flip_cancel',{p_id:f.id}).then(function(){ lobby(); }).catch(function(e){ toast(e.message); }); };
}
function share(f){
  var url='https://www.theshadowhook.com/flip.html?code='+f.code, txt='The Flip — '+f.title+' ('+plural(f.spots,'spot')+'). Code '+f.code;
  if(navigator.share) navigator.share({title:'The Flip',text:txt,url:url}).catch(function(){});
  else if(navigator.clipboard) navigator.clipboard.writeText(txt+' · '+url).then(function(){ toast('Copied — paste it to the crew'); });
}
function doneHTML(f){
  var me=wonBy(f), meIn=f.players.some(function(p){ return p.me; });
  var h='<div class="coin">🏆</div>'+header(f);
  h+='<div class="banner'+(meIn&&!me?' lost':'')+'">'+(me?'YOU GOT IT':meIn?'NOT THIS TIME':'THE FLIP LANDED')+'</div>';
  h+='<div class="card"><div class="lbl">THE ORDER</div><div class="names" id="order">';
  f.draw.forEach(function(d,i){ var p=f.players.filter(function(x){ return x.id===d.id; })[0]||{};
    h+='<div class="nm '+(i<f.spots?'win':'out')+(p.me?' me':'')+'"><span class="pos">'+(i+1)+'</span><span class="who">'+esc(d.n)+'</span>'+(i<f.spots?'<span class="mb">🏆</span>':'')+'</div>'; });
  h+='</div><div class="hint">Gold got the '+plural(f.spots,'spot')+'. The rest is the backup order if a spot opens up. Drawn by the server '+ago(f.drawn_at)+'.</div></div>';
  if(f.is_host) h+='<button class="ghost" id="again">FLIP AGAIN WITH THE SAME NAMES</button>';
  return h;
}
function drawDone(f){ $('view').innerHTML=doneHTML(f); wireAgain(f); }
function wireAgain(f){ var b=$('again'); if(!b) return; b.onclick=function(){ b.disabled=true;
  var names=f.players.filter(function(p){ return !p.me; }).map(function(p){ return p.n; }).join(', ');
  rpc('flip_new',{p_title:f.title,p_spots:f.spots,p_names:names}).then(showFlip).catch(function(e){ toast(e.message); b.disabled=false; }); }; }

/* the reveal: names light up in turn, slowing down, then the winners lock in gold one by one */
function reveal(f){
  var names=f.players.map(function(p){ return p.n; });
  var h='<div class="coin spin">🪙</div>'+header(f)+'<div class="banner" id="rb">FLIPPING…</div><div class="card"><div class="names">'+
    f.players.map(function(p,i){ return '<div class="nm" data-i="'+i+'"><span class="who">'+esc(p.n)+'</span></div>'; }).join('')+'</div></div>';
  $('view').innerHTML=h;
  var rows=document.querySelectorAll('.nm[data-i]'), idx=0, step=0, delay=70, total=20;
  function tick(){
    rows.forEach(function(r){ r.classList.remove('hot'); });
    rows[idx%rows.length].classList.add('hot');
    try{ navigator.vibrate&&navigator.vibrate(8); }catch(e){}
    idx+=1+Math.floor(Math.random()*rows.length); step++;
    delay*=1.08;
    if(step<total) setTimeout(tick,delay); else lockIn(0);
  }
  function lockIn(k){
    if(k>=f.spots){ setTimeout(function(){ drawDone(f); try{ navigator.vibrate&&navigator.vibrate(wonBy(f)?[60,40,120]:30); }catch(e){} },650); return; }
    var w=f.draw[k], i=-1; f.players.forEach(function(p,j){ if(p.id===w.id) i=j; });
    rows.forEach(function(r){ r.classList.remove('hot'); });
    if(i>=0){ rows[i].classList.add('win'); rows[i].insertAdjacentHTML('beforeend','<span class="mb">🏆</span>'); }
    $('rb').textContent=f.spots===1?String(w.n).toUpperCase()+' GOT IT':'SPOT '+(k+1)+': '+String(w.n).toUpperCase();
    setTimeout(function(){ lockIn(k+1); },f.spots>1?900:1200);
  }
  setTimeout(tick,300);
}
</script>
</body>
</html>
