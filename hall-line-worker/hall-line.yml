# .github/workflows/hall-line.yml
# Calls the hall's recorded dispatch line after each board ends, transcribes it,
# and posts "left off at ___" to the Order's board wire.
#
# #jul30 — RETRIES INSTEAD OF ONE SHOT. The old schedule made exactly one call
# per board (09:40 / 19:40) — catch the recording mid-update and the day's
# reading was a conf-0 row until someone fired the workflow by hand. Now each
# window gets a sweep of attempts; the worker's own gate + MIN_CONF + the
# human-owns-the-row rule make extra runs harmless, and board_wire only ever
# carries the freshest confident reading.
# Night dispatch also ends 19:00 now (was 19:30) — pair this file with the
# leftoff.js gate change (19:35 → 19:05) or the early night runs will exit.
#
# GitHub cron is UTC and ignores daylight saving, so runs are scheduled at both
# the PDT and PST offsets — off-window firings exit in under a second, and
# same-window overlaps just act as extra retries.
name: hall-line-leftoff

on:
  schedule:
    # ── morning sweep (day board ends 09:30) ──
    - cron: '40 16 * * *'   # 09:40 PDT — first read
    - cron: '5 17 * * *'    # 10:05 PDT retry   (09:05 PST → gate closed, exits)
    - cron: '40 17 * * *'   # 09:40 PST — first read · 10:40 PDT retry
    - cron: '5 18 * * *'    # 10:05 PST retry   · 11:05 PDT retry
    # ── night sweep (night board ends 19:00 now) ──
    - cron: '10 2 * * *'    # 19:10 PDT — first read, right after the new 7:00 end
    - cron: '30 2 * * *'    # 19:30 PDT retry
    - cron: '55 2 * * *'    # 19:55 PDT retry
    - cron: '10 3 * * *'    # 19:10 PST — first read · 20:10 PDT retry
    - cron: '30 3 * * *'    # 19:30 PST retry    · 20:30 PDT retry
  workflow_dispatch:
    inputs:
      force:
        description: 'Run even outside the fresh-recording window'
        type: boolean
        default: false
      dry_run:
        description: 'Do everything except write to Supabase'
        type: boolean
        default: false
      transcript:
        description: 'Skip the call — parse this text instead (testing)'
        required: false

concurrency:
  group: hall-line
  cancel-in-progress: false

jobs:
  leftoff:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Call the hall line and post where it left off
        env:
          TWILIO_SID:           ${{ secrets.TWILIO_SID }}
          TWILIO_TOKEN:         ${{ secrets.TWILIO_TOKEN }}
          TWILIO_FROM:          ${{ secrets.TWILIO_FROM }}
          DISPATCH_NUMBER:      ${{ secrets.DISPATCH_NUMBER }}
          DISPATCH_DTMF:        ${{ secrets.DISPATCH_DTMF }}
          CALL_SECONDS:         ${{ vars.CALL_SECONDS || '120' }}
          OPENAI_API_KEY:       ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SLOT_KEYWORDS:        ${{ vars.SLOT_KEYWORDS }}
          MIN_CONF:             ${{ vars.MIN_CONF || '0.75' }}
        run: |
          ARGS=""
          [ "${{ inputs.force }}" = "true" ] && ARGS="$ARGS --force"
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          if [ -n "${{ inputs.transcript }}" ]; then
            node hall-line-worker/leftoff.js $ARGS --transcript "${{ inputs.transcript }}"
          else
            node hall-line-worker/leftoff.js $ARGS
          fi
